<!DOCTYPE html>
<html>
<head><title>Game (Peer 2) - Multi QR</title></head>
<body>
<h1>Game (Peer 2) - Genereer Multi QR</h1>

<label>Offer SDP (JSON):</label><br>
<textarea id="offerSDP" style="width:100%; height:120px;"></textarea><br><br>

<button id="generateQRs">Genereer QR codes</button><br><br>

<div id="qrcodes"></div>

<script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
  const QR_CHUNK_SIZE = 100; // pas evt aan voor kleinere/grotere QR's

  document.getElementById('generateQRs').onclick = () => {
    const offerText = document.getElementById('offerSDP').value.trim();
    if (!offerText) {
      alert("Vul de offer SDP in");
      return;
    }

    // Comprimeer en base64 encode
    const compressed = LZString.compressToBase64(offerText);
    
    // Split in stukjes
    let chunks = [];
    for (let i = 0; i < compressed.length; i += QR_CHUNK_SIZE) {
      chunks.push(compressed.substring(i, i + QR_CHUNK_SIZE));
    }

    const total = chunks.length;

    // Maak container leeg
    const container = document.getElementById('qrcodes');
    container.innerHTML = "";

    // Genereer QR codes met info: "index/total:data"
    chunks.forEach((chunk, idx) => {
      const text = `${idx+1}/${total}:${chunk}`;
      const div = document.createElement('div');
      div.style.display = "inline-block";
      div.style.margin = "10px";
      div.style.textAlign = "center";
      container.appendChild(div);

      // QR code canvas
      const canvas = document.createElement('canvas');
      div.appendChild(canvas);

      QRCode.toCanvas(canvas, text, {width: 150, margin: 1}, err => {
        if(err) console.error(err);
      });

      // Label
      const label = document.createElement('div');
      label.textContent = `QR ${idx+1} / ${total}`;
      div.appendChild(label);
    });
  };
</script>
</body>
</html>
