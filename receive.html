<!DOCTYPE html>
<html>
<head><title>Game (Peer 2)</title></head>
<body>
<h1>Game (Peer 2)</h1>

<button id="start">Start en toon QR</button><br><br>
<canvas id="qrcode" width="250" height="250" style="border:1px solid #ccc"></canvas>

<p>Status:<br><pre id="log"></pre></p>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>

<script>
  const log = msg => (document.getElementById('log').textContent += msg + "\n");

  let pc = null;
  let dc = null;
  let offerSDP = "";

  document.getElementById('start').onclick = async () => {
    if (pc) return;
    log("PeerConnection maken...");
    pc = new RTCPeerConnection({iceServers: []});

    dc = pc.createDataChannel("data");
    dc.onopen = () => log("DataChannel open!");
    dc.onmessage = e => log("Ontvangen: " + e.data);
    dc.onclose = () => log("DataChannel gesloten");

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    offerSDP = JSON.stringify(offer);
    const compressed = LZString.compressToBase64(offerSDP);

    const canvas = document.getElementById('qrcode');
    QRCode.toCanvas(canvas, compressed, {width:250}, err => {
      if(err) log("QR error: " + err);
      else log("QR-code gemaakt, scan met controller");
    });
  };
</script>
</body>
</html>
