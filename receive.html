<!DOCTYPE html>
<html>
<head><title>receive</title></head>
<body>
<h1>Game (Peer 2)</h1>

<button id="start">Start en maak QR-code</button><br><br>

<div id="qrcode"></div>

<p>Status:<br><pre id="log"></pre></p>

<!-- QRCode lib -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<!-- LZ-String lib -->
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>

<script>
  const logElem = document.getElementById('log');
  function log(msg) { logElem.textContent += msg + "\n"; }

  let pc = null;
  let dc = null;

  async function gatherIceCandidates() {
    return new Promise(resolve => {
      let candidates = [];
      pc.onicecandidate = e => {
        if(e.candidate) {
          candidates.push(e.candidate.toJSON());
          updateQRCode({sdp: pc.localDescription, ice: candidates});
        } else {
          resolve(candidates);
        }
      };
    });
  }

  function updateQRCode(data) {
    const jsonStr = JSON.stringify(data);
    const compressed = LZString.compressToUTF16(jsonStr);
    const qrDiv = document.getElementById('qrcode');
    qrDiv.innerHTML = "";
    QRCode.toCanvas(qrDiv, compressed, {width:250}, err => {
      if(err) log("QR error: " + err);
      else log("QR-code gemaakt, scan met controller");
    });
  }

  document.getElementById('start').onclick = async () => {
    if(pc) return;
    log("PeerConnection maken...");
    pc = new RTCPeerConnection({iceServers: []});

    dc = pc.createDataChannel("data");
    dc.onopen = () => log("DataChannel open!");
    dc.onmessage = e => log("Ontvangen: " + e.data);
    dc.onclose = () => log("DataChannel gesloten");

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await gatherIceCandidates();
  };
</script>
</body>
</html>
