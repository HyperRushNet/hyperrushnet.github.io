<!DOCTYPE html>
<html>
<head><title>Game (Peer 2)</title></head>
<body>
<h1>Game (Peer 2)</h1>

<button id="start">Start en maak QR-code</button><br><br>

<div id="qrcode"></div>

<p>Status:<br><pre id="log"></pre></p>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
  const logElem = document.getElementById('log');
  function log(msg) { logElem.textContent += msg + "\n"; }

  let pc = null;
  let dc = null;

  function encodeCompact(str) {
    return btoa(str).replace(/\+/g,'p').replace(/\//g,'s').replace(/=/g,'e').toLowerCase();
  }

  async function gatherIceCandidates() {
    return new Promise(resolve => {
      let candidates = [];
      pc.onicecandidate = e => {
        if(e.candidate) {
          candidates.push(e.candidate.toJSON());
          updateQRCode(JSON.stringify({sdp: pc.localDescription, ice: candidates}));
        } else {
          resolve(candidates);
        }
      };
    });
  }

  function updateQRCode(jsonStr) {
    const compact = encodeCompact(jsonStr);
    const qrDiv = document.getElementById('qrcode');
    qrDiv.innerHTML = "";
    QRCode.toCanvas(qrDiv, compact, {width:250}, err => {
      if(err) log("QR error: " + err);
      else log("QR-code gemaakt, scan met controller");
    });
  }

  document.getElementById('start').onclick = async () => {
    if(pc) return;
    log("PeerConnection maken...");
    pc = new RTCPeerConnection({iceServers: []});

    dc = pc.createDataChannel("data");
    dc.onopen = () => log("DataChannel open!");
    dc.onmessage = e => log("Ontvangen: " + e.data);
    dc.onclose = () => log("DataChannel gesloten");

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await gatherIceCandidates();
  };
</script>
</body>
</html>
