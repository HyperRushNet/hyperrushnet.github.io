<!DOCTYPE html>
<html>
<head><title>Game (Peer 2)</title></head>
<body>
<h1>Game (Peer 2)</h1>

<button id="createOffer">Maak Offer + ICE (als 0/1-string)</button><br><br>

<label>Offer + ICE (alleen 0 en 1, overtypen):</label><br>
<textarea id="offerBin" style="width:100%; height:150px;" readonly></textarea><br><br>

<p>Log:<br><pre id="log"></pre></p>

<script>
  let pc = null;
  const logElem = document.getElementById('log');

  function log(msg){
    logElem.textContent += msg + "\n";
  }

  function strToBin(str) {
    let bin = "";
    for(let i=0; i<str.length; i++){
      let code = str.charCodeAt(i);
      let b = code.toString(2).padStart(8, '0');
      bin += b;
    }
    return bin;
  }

  async function gatherIceCandidates(timeoutMs = 3000) {
    return new Promise(resolve => {
      let candidates = [];
      let done = false;

      pc.onicecandidate = e => {
        if(e.candidate) {
          candidates.push(e.candidate.toJSON());
          updateOfferText();
        } else {
          if (!done) {
            done = true;
            resolve(candidates);
          }
        }
      };

      // fallback: stop na timeout ook
      setTimeout(() => {
        if (!done) {
          done = true;
          resolve(candidates);
        }
      }, timeoutMs);
    });
  }

  async function updateOfferText() {
    const obj = {
      sdp: pc.localDescription,
      ice: pc._iceCandidates || []
    };
    document.getElementById('offerBin').value = strToBin(JSON.stringify(obj));
  }

  document.getElementById('createOffer').onclick = async () => {
    if(pc) return;
    log("Offer aan het maken...");
    
    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });
    pc._iceCandidates = [];

    pc.onicecandidate = e => {
      if(e.candidate) {
        pc._iceCandidates.push(e.candidate.toJSON());
        updateOfferText();
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await gatherIceCandidates(3000);

    log("Offer + ICE klaar als binaire string");
  };
</script>
</body>
</html>
