<!DOCTYPE html>
<html>
<head>
  <title>Game</title>
  <style> #qrcode { margin-top: 10px; } </style>
</head>
<body>
<h1>Game (Peer 2)</h1>

<label>Offer + ICE plakken (van Peer 1, compacte string):</label><br>
<textarea id="offerData" style="width:100%; height:120px;"></textarea><br><br>

<button id="createAnswer">Maak Answer + ICE</button><br><br>

<label>Answer + ICE (scan QR-code op Controller):</label><br>
<div id="qrcode"></div>

<p>Ontvangen data:<br><pre id="log"></pre></p>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
  let pc = null;
  let dc = null;
  const logElem = document.getElementById('log');

  function log(msg) {
    logElem.textContent += msg + "\n";
  }

  function decodeFromCompact(str) {
    return atob(
      str
        .toUpperCase()
        .replace(/p/g, '+')
        .replace(/s/g, '/')
        .replace(/e/g, '=')
    );
  }

  async function gatherIceCandidates() {
    return new Promise(resolve => {
      let candidates = [];
      pc.onicecandidate = e => {
        if (e.candidate) {
          candidates.push(e.candidate.toJSON());
          updateAnswerQRCode(JSON.stringify({
            sdp: pc.localDescription,
            ice: candidates
          }));
        } else {
          resolve(candidates);
        }
      };
    });
  }

  function updateAnswerQRCode(dataStr) {
    const compact = btoa(dataStr)
      .replace(/\+/g, 'p')
      .replace(/\//g, 's')
      .replace(/=/g, 'e')
      .toLowerCase();
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = "";
    QRCode.toCanvas(qrContainer, compact, { width: 200 }, function (error) {
      if (error) log("QR code error: " + error);
      else log("QR code gemaakt");
    });
  }

  document.getElementById('createAnswer').onclick = async () => {
    if(pc) return; // voorkom dubbel
    try {
      pc = new RTCPeerConnection({iceServers: []});
      pc.ondatachannel = event => {
        dc = event.channel;
        dc.onopen = () => log("DataChannel open!");
        dc.onmessage = e => log("Ontvangen: " + e.data);
        dc.onclose = () => log("DataChannel gesloten");
      };

      const compactStr = document.getElementById('offerData').value.trim();
      const jsonStr = decodeFromCompact(compactStr);
      const data = JSON.parse(jsonStr);

      if(!data.sdp || !data.ice) {
        log("Ongeldige data");
        return;
      }

      await pc.setRemoteDescription(data.sdp);

      for(const c of data.ice) {
        await pc.addIceCandidate(new RTCIceCandidate(c));
      }

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await gatherIceCandidates();

      log("Answer + ICE klaar en QR code getoond");
    } catch(e) {
      log("Fout bij createAnswer: " + e);
    }
  };
</script>
</body>
</html>
