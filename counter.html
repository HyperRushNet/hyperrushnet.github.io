<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRN Visits JS with Toast</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  button { margin: 5px; padding: 10px 20px; font-size: 16px; }
  pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }

  /* Toast styling */
  #toast {
    visibility: hidden;
    min-width: 200px;
    margin-left: -100px;
    background-color: #333;
    color: #fff;
    text-align: center;
    border-radius: 5px;
    padding: 12px;
    position: fixed;
    z-index: 100;
    left: 50%;
    bottom: 30px;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.5s, bottom 0.5s;
  }
  #toast.show {
    visibility: visible;
    opacity: 1;
    bottom: 50px;
  }
</style>
</head>
<body>

<h1>HRN Visits Example</h1>
<button id="addVisit">Add Visit</button>
<button id="viewVisits">View Visits</button>
<button id="resetVisits">Reset Visits</button>
<pre id="output"></pre>

<div id="toast"></div>

<script>
// HRN Visits JS Library
const hrn = {
    apiBase: 'https://counter-ivn5.onrender.com',
    visits: {
        add: async function() {
            const res = await fetch(`${hrn.apiBase}/`, { method: 'POST' });
            return await res.json();
        },
        view: async function() {
            const res = await fetch(`${hrn.apiBase}/view`);
            return await res.json();
        },
        reset: async function() {
            const res = await fetch(`${hrn.apiBase}/reset`, { method: 'POST' });
            return await res.json();
        }
    }
};

// Toast functie
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.className = 'show';
    setTimeout(() => {
        toast.className = toast.className.replace('show', '');
    }, 2000);
}

// Event listeners voor demo
document.getElementById('addVisit').addEventListener('click', async () => {
    try {
        const data = await hrn.visits.add();
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        showToast('Visit added!');
    } catch (err) {
        document.getElementById('output').innerText = `Error: ${err}`;
        showToast('Error adding visit');
    }
});

document.getElementById('viewVisits').addEventListener('click', async () => {
    try {
        const data = await hrn.visits.view();
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        showToast('Visits retrieved!');
    } catch (err) {
        document.getElementById('output').innerText = `Error: ${err}`;
        showToast('Error viewing visits');
    }
});

document.getElementById('resetVisits').addEventListener('click', async () => {
    try {
        const data = await hrn.visits.reset();
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        showToast('Visits reset!');
    } catch (err) {
        document.getElementById('output').innerText = `Error: ${err}`;
        showToast('Error resetting visits');
    }
});
</script>

</body>
</html>
