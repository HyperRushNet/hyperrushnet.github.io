let decodedHTML="";
try{decodedHTML=atob(base64Template).replace("__COUNTER__",counterId)}catch(e){}
if(decodedHTML){document.write(decodedHTML)}

let result="";
function extractNumbers(){
  const images=document.querySelectorAll("img");
  const container=document.getElementById("k3j4h5g6f7d8s9a0q1w2e3r4t5y6");
  container.innerHTML="";
  if(images.length===0){container.textContent="Geen afbeeldingen gevonden (mogelijk geblokkeerd).";return}
  let all="";
  images.forEach(img=>{
    const parts=img.src.split("/");
    const last=parts[parts.length-1];
    const match=last.match(/\d+/);
    if(match)all+=match[0];
  });
  result=all.replace(/^0+/,"")||"0";
  container.textContent=result;
}
window.addEventListener("load",extractNumbers);
