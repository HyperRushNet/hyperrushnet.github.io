<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Mode Neutralisatie</title>
  <style>
    body {
      background: #fff;
      color: #000;
      font-family: sans-serif;
      padding: 50px;
    }

    /* Deze sectie blijft licht, zelfs als Chrome alles invert */
    .no-invert {
      background: white !important;
      color: black !important;
      padding: 20px;
      margin-top: 30px;
      border-radius: 8px;

      /* Neutraliseer geforceerde dark mode */
      filter: invert(1) hue-rotate(180deg);
    }

    /* Als de rest van de pagina donker wordt gemaakt, blijft dit normaal */
  </style>
</head>
<body>
  <h1>Chrome Android Dark Mode Fix</h1>
  <p>Deze site probeert geforceerde dark mode van Chrome tegen te gaan.</p>

  <div class="no-invert">
    <p>Ik blijf helder, ook als Chrome probeert te inverteren!</p>
  </div>
</body>
</html>
