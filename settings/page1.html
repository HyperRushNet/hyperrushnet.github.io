<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meerdere Dynamische Switches</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f; /* Donkere achtergrond */
            color: #e0e0e0; /* Lichte tekstkleur */
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .switch-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Ruimte tussen de switch-elementen */
            padding: 10px 0;
            border-bottom: 1px solid #333; /* Scheidingslijn tussen switches */
        }
        
        .switch-wrapper:last-child {
            border-bottom: none;
        }

        .switch-wrapper h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #ffffff;
        }

        .switch-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .description {
            font-size: 0.9rem;
            color: #a0a0a0;
            line-height: 1.4;
        }
        
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Label links, switch rechts */
            font-size: 1.2rem;
            width: 100%;
        }

        .switch-label-text {
            cursor: pointer;
        }

        .switch-input {
            display: none;
        }

        .switch-label {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            background-color: #555; /* Donkere kleur uit */
            border-radius: 34px;
            cursor: pointer;
            transition: background-color 0.4s;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.4);
        }

        .switch-label::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 26px;
            height: 26px;
            background-color: #ccc; /* Lichte kleur knop */
            border-radius: 50%;
            transition: transform 0.4s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .switch-input:checked + .switch-label {
            background-color: #2196F3; /* Blauwe kleur aan */
        }

        .switch-input:checked + .switch-label::after {
            transform: translateX(26px);
            background-color: white;
        }

        /* Responsive design voor kleinere schermen */
        @media (max-width: 600px) {
            .switch-container {
                font-size: 1rem;
            }
            
            .switch-label {
                width: 50px;
                height: 28px;
            }

            .switch-label::after {
                top: 3px;
                left: 3px;
                width: 22px;
                height: 22px;
            }

            .switch-input:checked + .switch-label::after {
                transform: translateX(22px);
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div id="switches-container">
            </div>
    </div>

    <script>
        // JSON-data voor de switches
        const switchesData = [
            {
                id: 'redirectBlockSwitch',
                label: 'Redirect Block',
                description: 'Blokkeer ongewenste automatische doorverwijzingen van websites. Handig om te voorkomen dat je naar spam- of advertentiepagina\'s wordt gestuurd.'
            },
            {
                id: 'adBlockSwitch',
                label: 'Advertenties blokkeren',
                description: 'Verberg de meeste online advertenties om je browse-ervaring te versnellen en te verbeteren.'
            },
            {
                id: 'darkModeSwitch',
                label: 'Donkere Modus',
                description: 'Schakel een donkere modus in voor websites die dit ondersteunen, om je ogen te ontlasten bij weinig licht.'
            },
            {
                id: 'scriptBlockSwitch',
                label: 'Scripts blokkeren',
                description: 'Blokkeer JavaScript-uitvoering op onbekende websites voor extra beveiliging.'
            }
        ];

        const switchesContainer = document.getElementById('switches-container');

        switchesData.forEach(switchItem => {
            const wrapper = document.createElement('div');
            wrapper.classList.add('switch-wrapper');

            const group = document.createElement('div');
            group.classList.add('switch-group');

            const container = document.createElement('div');
            container.classList.add('switch-container');

            const labelText = document.createElement('label');
            labelText.htmlFor = switchItem.id;
            labelText.classList.add('switch-label-text');
            labelText.textContent = switchItem.label;

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.id = switchItem.id;
            input.classList.add('switch-input');

            const switchLabel = document.createElement('label');
            switchLabel.htmlFor = switchItem.id;
            switchLabel.classList.add('switch-label');

            const description = document.createElement('p');
            description.classList.add('description');
            description.textContent = switchItem.description;

            container.appendChild(labelText);
            container.appendChild(input);
            container.appendChild(switchLabel);
            
            group.appendChild(container);
            group.appendChild(description);

            wrapper.appendChild(group);
            switchesContainer.appendChild(wrapper);
        });
    </script>
</body>
</html>
