<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .main-container { max-width: 800px; margin: 0 auto; }
    .switch-section { padding: 12px 0; border-bottom: 1px solid #333; }
    .switch-item { display: flex; flex-direction: column; gap: 8px; }
    .switch-container {
      display:flex; align-items:center; justify-content:space-between;
      gap:12px;
    }
    .switch-label-text { cursor: pointer; user-select: none; }
    .switch-input { display: none; }
    .switch-label {
      position: relative; display: inline-block; width: 60px; height: 34px;
      background:#555; border-radius:34px; transition:background .25s; cursor:pointer;
    }
    .switch-label::after {
      content: ''; position:absolute; top:4px; left:4px; width:26px; height:26px;
      background:#ccc; border-radius:50%; transition: transform .25s;
    }
    .switch-input:checked + .switch-label { background:#2196F3; }
    .switch-input:checked + .switch-label::after { transform: translateX(26px); background:white; }
    .description { color:#a0a0a0; font-size:0.95rem; margin:8px 0 0 0; }
    .saved { color:#4caf50; font-size:0.9rem; margin-top:10px; display:none; }
  </style>
</head>
<body>
  <div class="main-container">
    <div id="switches-container"></div>
    <p id="saved-msg" class="saved">Saved!</p>
  </div>

  <script>
    // --- Config ---
    const switchesData = [
      {
        id: 'redirectBlockSwitch',
        label: 'Redirect Block',
        description: 'Prevent games from redirecting you or opening new tabs.',
        defaultActive: false
      }
    ];
    const LOCAL_KEY = 'userSettings';

    // --- Helpers ---
    function readSettings() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        // ensure defaults present
        const out = {};
        switchesData.forEach(s => out[s.id] = parsed.hasOwnProperty(s.id) ? !!parsed[s.id] : !!s.defaultActive);
        return out;
      } catch (err) {
        console.warn('Failed reading settings, returning defaults', err);
        const defaults = {};
        switchesData.forEach(s => defaults[s.id] = !!s.defaultActive);
        return defaults;
      }
    }

    function writeSettings(settings) {
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(settings));
        // notify same-tab listeners
        window.dispatchEvent(new CustomEvent('userSettingsChanged', { detail: settings }));
      } catch (err) {
        console.error('Failed to save settings', err);
      }
    }

    // Update UI from settings object
    function updateUIFromSettings(settings) {
      switchesData.forEach(s => {
        const el = document.getElementById(s.id);
        if (el) el.checked = !!settings[s.id];
      });
    }

    // --- Render ---
    const container = document.getElementById('switches-container');
    const savedMsg = document.getElementById('saved-msg');

    function render() {
      container.innerHTML = '';
      const settings = readSettings();

      switchesData.forEach(s => {
        const section = document.createElement('div');
        section.className = 'switch-section';

        const item = document.createElement('div');
        item.className = 'switch-item';

        const row = document.createElement('div');
        row.className = 'switch-container';

        const labelText = document.createElement('label');
        labelText.className = 'switch-label-text';
        labelText.htmlFor = s.id;
        labelText.textContent = s.label;

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.id = s.id;
        input.className = 'switch-input';
        input.checked = !!settings[s.id];

        // when changed: update localStorage and notify
        input.addEventListener('change', (ev) => {
          const cur = readSettings();
          cur[s.id] = !!ev.target.checked;
          writeSettings(cur);
          // show saved feedback briefly
          savedMsg.style.display = 'block';
          clearTimeout(savedMsg._t);
          savedMsg._t = setTimeout(() => savedMsg.style.display = 'none', 1100);
        });

        const visualLabel = document.createElement('label');
        visualLabel.className = 'switch-label';
        visualLabel.htmlFor = s.id;

        const desc = document.createElement('p');
        desc.className = 'description';
        desc.textContent = s.description;

        row.appendChild(labelText);
        row.appendChild(input);
        row.appendChild(visualLabel);

        item.appendChild(row);
        item.appendChild(desc);
        section.appendChild(item);
        container.appendChild(section);
      });
    }

    // --- React to external changes (other tabs) ---
    window.addEventListener('storage', (e) => {
      if (e.key === LOCAL_KEY) {
        // update UI using the newest localStorage value
        updateUIFromSettings(readSettings());
      }
    });

    // Also react to custom event in same-tab (we dispatch this ourselves in writeSettings)
    window.addEventListener('userSettingsChanged', (e) => {
      if (e?.detail) updateUIFromSettings(e.detail);
    });

    // initial render
    document.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
