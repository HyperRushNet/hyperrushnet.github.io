<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Settings</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        html, body {
            height: 100%;
            background: #121212;
            color: #eee;
            display: flex;
            overflow: hidden;
            font-size: 16px;
        }
        #sidebar {
            width: 260px;
            background: #1f1f1f;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px 0;
            box-shadow: 2px 0 8px #000;
            transition: width 0.5s ease-in-out;
            z-index: 100;
        }
        #sidebar.collapsed {
            width: 70px;
        }
        #sidebar button {
            all: unset;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 22px;
            color: #ccc;
            border-left: 4px solid transparent;
            margin-bottom: 4px;
            transition: background 0.2s ease-in-out, color 0.2s ease-in-out;
            white-space: nowrap;
            overflow: hidden;
        }
        #sidebar button:not(#toggleSidebarBtn) {
            font-size: 1rem;
        }
        #sidebar.collapsed button {
            padding: 12px 0;
            justify-content: center;
            gap: 0;
        }
        #sidebar button ion-icon {
            font-size: 1.4rem;
            width: 24px;
            text-align: center;
            user-select: none;
        }
        #sidebar.collapsed button ion-icon {
            width: 100%;
        }
        #sidebar button span {
            white-space: nowrap;
            user-select: none;
            transition: opacity 0.2s ease-in-out;
            display: block;
        }
        #sidebar.collapsed button span {
            opacity: 0;
            pointer-events: none;
            width: 0;
        }
        #sidebar button:hover:not(.active) {
            background: #2a2a2a;
            color: #fff;
        }
        #sidebar button.active {
            color: #0af;
            border-left-color: #0af;
            background: #151515;
            font-weight: 600;
        }
        #sidebar button:focus {
            outline: none;
            box-shadow: none;
        }
        #content {
            flex-grow: 1;
            background: #181818;
            overflow: hidden;
            position: relative;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .tab-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .tab-iframe.active {
            visibility: visible;
            opacity: 1;
        }
        /* Nieuwe klasse om frames te behouden en niet te tonen */
        .tab-iframe.cached {
            visibility: hidden;
            opacity: 0;
        }
        #toggleSidebarBtn {
            margin-top: auto;
            border-top: 1px solid #333;
            padding: 12px;
            color: #777;
            cursor: pointer;
            transition: color 0.12s;
            display: flex;
            align-items: center;
        }
        #toggleSidebarBtn:hover {
            color: #0af;
        }
        #sidebar.collapsed #toggleSidebarBtn {
            padding: 12px 0;
            justify-content: center;
        }
        #sidebar.collapsed #toggleSidebarBtn span {
            width: 0;
        }
        @media (max-width: 768px) {
            #sidebar {
                width: 70px !important;
            }
            #sidebar button span {
                opacity: 0;
                pointer-events: none;
                width: 0;
            }
            #content {
                width: calc(100vw - 70px) !important;
            }
            #content.collapsed-sidebar {
                width: calc(100vw - 70px) !important;
            }
            #toggleSidebarBtn {
                display: none !important;
            }
        }
        #full-page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.5s ease-in-out;
            flex-direction: column;
            gap: 15px;
        }
        #full-page-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-text {
            font-size: 1em;
            color: #ccc;
            font-weight: 500;
        }
        .progress-bar-container {
            width: 250px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: #0af;
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="full-page-loader">
        <div class="loading-text">Loading Game Settings...</div>
        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <aside id="sidebar" aria-label="Navigation">
        <button class="active" onclick="showTab(this)" aria-selected="true" data-tab="tab-1">
            <ion-icon name="ban-outline"></ion-icon><span>Blocks</span>
        </button>
        <button onclick="showTab(this)" aria-selected="false" data-tab="tab-2">
            <ion-icon name="color-palette-outline"></ion-icon><span>Themes</span>
        </button>
        <button onclick="showTab(this)" aria-selected="false" data-tab="tab-3">
            <ion-icon name="eye-off-outline"></ion-icon><span>Hide</span>
        </button>
        <button onclick="showTab(this)" aria-selected="false" data-tab="tab-4">
            <ion-icon name="desktop-outline"></ion-icon><span>Device</span>
        </button>
        <button onclick="showTab(this)" aria-selected="false" data-tab="tab-5">
            <ion-icon name="information-circle-outline"></ion-icon><span>Info</span>
        </button>
        <button id="toggleSidebarBtn" onclick="toggleSidebar()" aria-label="Collapse sidebar">
            <ion-icon name="chevron-back-circle-outline"></ion-icon><span>Collapse</span>
        </button>
    </aside>

    <main id="content" role="tabpanel">
        <div class="iframe-container">
            <iframe id="tab-1" class="tab-iframe active" src="./blocks.html" title="Blocks"></iframe>
            <iframe id="tab-2" class="tab-iframe cached" src="./themes.html" title="Themes"></iframe>
            <iframe id="tab-3" class="tab-iframe cached" src="./hide.html" title="Hide"></iframe>
            <iframe id="tab-4" class="tab-iframe cached" src="./device.html" title="Device"></iframe>
            <iframe id="tab-5" class="tab-iframe cached" src="./info.html" title="Info"></iframe>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('content');
            const toggleBtn = document.getElementById('toggleSidebarBtn');
            const tabButtons = sidebar.querySelectorAll('button:not(#toggleSidebarBtn)');
            const iframes = document.querySelectorAll('.tab-iframe');
            const fullPageLoader = document.getElementById('full-page-loader');
            const progressBar = document.getElementById('progress-bar');
            let resizeInterval = null;

            let resourcesToLoadCount = iframes.length;
            let resourcesLoadedCount = 0;
            let currentActiveTabId = 'tab-1';

            function updateProgressBar() {
                const stepSize = 100 / resourcesToLoadCount;
                const progressWidth = stepSize * resourcesLoadedCount;
                progressBar.style.width = `${progressWidth}%`;
                if (resourcesLoadedCount === resourcesToLoadCount) {
                    progressBar.style.width = '100%';
                    setTimeout(() => {
                        fullPageLoader.classList.add('hidden');
                    }, 500);
                }
            }

            iframes.forEach(iframe => {
                iframe.addEventListener('load', () => {
                    resourcesLoadedCount++;
                    updateProgressBar();
                });
            });
            
            function showTab(btn) {
                const targetTabId = btn.dataset.tab;
                if (targetTabId === currentActiveTabId) return;

                const currentActiveIframe = document.getElementById(currentActiveTabId);
                const newActiveIframe = document.getElementById(targetTabId);

                // Verwijder 'active' en voeg 'cached' toe aan de huidige tab
                if (currentActiveIframe) {
                    currentActiveIframe.classList.remove('active');
                    currentActiveIframe.classList.add('cached');
                }

                // Verwijder 'cached' en voeg 'active' toe aan de nieuwe tab
                if (newActiveIframe) {
                    newActiveIframe.classList.remove('cached');
                    newActiveIframe.classList.add('active');
                }

                // Update de actieve knop en de status in het geheugen
                tabButtons.forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-selected', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-selected', 'true');
                currentActiveTabId = targetTabId;
            }

            function updateToggleButton() {
                if (window.innerWidth > 768) {
                    const isCollapsed = sidebar.classList.contains('collapsed');
                    const icon = toggleBtn.querySelector('ion-icon');
                    const text = toggleBtn.querySelector('span');
                    icon.setAttribute('name', isCollapsed ? 'chevron-forward-circle-outline' : 'chevron-back-circle-outline');
                    text.textContent = isCollapsed ? 'Expand' : 'Collapse';
                }
            }

            function resizeIframe() {
                const sidebarWidth = sidebar.offsetWidth;
                const pageWidth = window.innerWidth;
                const iframeWidth = pageWidth - sidebarWidth;
                content.style.width = `${iframeWidth}px`;
            }

            function toggleSidebar() {
                if (window.innerWidth > 768) {
                    sidebar.classList.toggle('collapsed');
                    updateToggleButton();
                    if (resizeInterval) {
                        clearInterval(resizeInterval);
                    }
                    let timeElapsed = 0;
                    resizeInterval = setInterval(() => {
                        resizeIframe();
                        timeElapsed += 16;
                        if (timeElapsed >= 1000) {
                            clearInterval(resizeInterval);
                            resizeInterval = null;
                            const isCollapsed = sidebar.classList.contains('collapsed');
                            content.style.width = `calc(100vw - ${isCollapsed ? '70px' : '260px'})`;
                        }
                    }, 16);
                }
            }

            function handleResize() {
                if (window.innerWidth <= 768) {
                    sidebar.classList.add('collapsed');
                    content.style.width = 'calc(100vw - 70px)';
                } else {
                    const isCollapsed = sidebar.classList.contains('collapsed');
                    content.style.width = `calc(100vw - ${isCollapsed ? '70px' : '260px'})`;
                }
                updateToggleButton();
            }

            window.addEventListener('DOMContentLoaded', handleResize);
            window.addEventListener('resize', handleResize);
            
            window.showTab = showTab;
            window.toggleSidebar = toggleSidebar;

            setTimeout(() => {
                iframes.forEach(iframe => {
                    if (iframe.contentWindow.document.readyState === 'complete') {
                        iframe.dispatchEvent(new Event('load'));
                    }
                });
            }, 100);
        });
    </script>
</body>
</html>
