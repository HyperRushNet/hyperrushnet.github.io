<!DOCTYPE html>
<html>
<head><title>Controller (Peer 1)</title></head>
<body>
<h1>Controller (Peer 1)</h1>

<button id="startScan">Scan QR-code</button><br><br>
<div id="reader" style="width:300px; height:300px; border:1px solid #ccc;"></div>

<button id="sendJump">Jump</button>
<button id="sendAttack">Attack</button>

<p>Status:<br><pre id="log"></pre></p>

<script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>

<script>
  const log = msg => (document.getElementById('log').textContent += msg + "\n");
  let pc = null, dc = null;

  async function setupConnection(offerSDP) {
    pc = new RTCPeerConnection({iceServers: []});
    pc.ondatachannel = e => {
      dc = e.channel;
      dc.onopen = () => log("DataChannel open!");
      dc.onmessage = ev => log("Ontvangen: " + ev.data);
      dc.onclose = () => log("DataChannel gesloten");
    };

    await pc.setRemoteDescription(offerSDP);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    log("Answer gegenereerd, verbinding wordt opgezet");

    pc.onicecandidate = e => {
      if(e.candidate) log("ICE: " + JSON.stringify(e.candidate.toJSON()));
    };
  }

  document.getElementById('startScan').onclick = () => {
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async qrMessage => {
        html5QrCode.stop();
        try {
          const offerText = LZString.decompressFromBase64(qrMessage);
          if (!offerText) throw "Decompressie mislukt";
          const offer = JSON.parse(offerText);
          await setupConnection(offer);
        } catch(e) {
          log("Fout: " + e);
        }
      },
      () => {}
    );
  };

  document.getElementById('sendJump').onclick = () => {
    if(dc && dc.readyState === 'open') {
      dc.send("jump");
      log("Jump gestuurd");
    } else {
      log("DataChannel niet open");
    }
  };

  document.getElementById('sendAttack').onclick = () => {
    if(dc && dc.readyState === 'open') {
      dc.send("attack");
      log("Attack gestuurd");
    } else {
      log("DataChannel niet open");
    }
  };
</script>
</body>
</html>
