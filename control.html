<!DOCTYPE html>
<html>
<head><title>Controller (Peer 1)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body { font-family:sans-serif; margin:10px; }</style>
</head>
<body>
<h1>Controller (Peer 1)</h1>

<button id="startScan">Scan QR-code</button>
<button id="restartScan" style="display:none;">Opnieuw scannen</button><br><br>

<div id="reader" style="width:100%; max-width:400px; height:300px; border:1px solid #ccc;"></div><br>

<button id="sendJump">Jump</button>
<button id="sendAttack">Attack</button>

<p>Status:<br><pre id="log" style="white-space: pre-wrap; word-wrap: break-word;"></pre></p>

<script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>

<script>
  const log = msg => (document.getElementById('log').textContent += msg + "\n");
  let pc = null, dc = null;
  let qrScanner = null;

  async function setupConnection(offerSDP) {
    pc = new RTCPeerConnection({iceServers: []});
    pc.ondatachannel = e => {
      dc = e.channel;
      dc.onopen = () => log("✅ DataChannel open!");
      dc.onmessage = ev => log("📨 Ontvangen: " + ev.data);
      dc.onclose = () => log("⚠️ DataChannel gesloten");
    };

    await pc.setRemoteDescription(offerSDP);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    log("✅ Answer gegenereerd, verbinding wordt opgezet");

    pc.onicecandidate = e => {
      if(e.candidate) log("ICE: " + JSON.stringify(e.candidate.toJSON()));
    };
  }

  async function startScanner() {
    document.getElementById('startScan').style.display = 'none';
    document.getElementById('restartScan').style.display = 'inline-block';
    const qrRegion = document.getElementById("reader");
    qrScanner = new Html5Qrcode("reader");

    try {
      await qrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: qrRegion.clientWidth * 0.8 },
        async qrMessage => {
          try {
            qrScanner.stop(); // stoppen na 1 goede scan
            const offerText = LZString.decompressFromBase64(qrMessage);
            if (!offerText) throw "Decompressie mislukt";
            const offer = JSON.parse(offerText);
            await setupConnection(offer);
          } catch(e) {
            log("❌ Fout in QR-verwerking: " + e);
          }
        },
        e => {} // Geen fout bij mislukte scans
      );
      log("📷 Scanner gestart");
    } catch (e) {
      log("❌ Scanner kon niet starten: " + e);
    }
  }

  document.getElementById('startScan').onclick = startScanner;
  document.getElementById('restartScan').onclick = () => {
    if (qrScanner) qrScanner.stop().then(() => startScanner());
  };

  document.getElementById('sendJump').onclick = () => {
    if(dc && dc.readyState === 'open'){
      dc.send("jump");
      log("🚀 Jump gestuurd");
    } else {
      log("⚠️ DataChannel niet open");
    }
  };

  document.getElementById('sendAttack').onclick = () => {
    if(dc && dc.readyState === 'open'){
      dc.send("attack");
      log("💥 Attack gestuurd");
    } else {
      log("⚠️ DataChannel niet open");
    }
  };
</script>
</body>
</html>
