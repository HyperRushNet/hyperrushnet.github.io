<!DOCTYPE html>
<html>
<head><title>Controller (Peer 1) - Multi QR Scan</title></head>
<body>
<h1>Controller (Peer 1) - Scan Multi QR codes</h1>

<button id="startScan">Start scannen</button><br><br>
<div id="reader" style="width:320px; height:320px; border:1px solid #ccc;"></div>

<p>Status:<br><pre id="log"></pre></p>

<button id="sendJump">Jump</button>
<button id="sendAttack">Attack</button>

<script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>

<script>
  const logElem = document.getElementById('log');
  const log = msg => {
    logElem.textContent += msg + "\n";
  };

  let pc = null, dc = null;
  let receivedChunks = {};
  let totalChunks = 0;

  const html5QrCode = new Html5Qrcode("reader");

  async function setupConnection(offerSDP) {
    pc = new RTCPeerConnection({iceServers: []});
    pc.ondatachannel = e => {
      dc = e.channel;
      dc.onopen = () => log("DataChannel open!");
      dc.onmessage = ev => log("Ontvangen: " + ev.data);
      dc.onclose = () => log("DataChannel gesloten");
    };

    await pc.setRemoteDescription(offerSDP);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    log("Answer gegenereerd, verbinding wordt opgezet");

    pc.onicecandidate = e => {
      if(e.candidate) log("ICE: " + JSON.stringify(e.candidate.toJSON()));
    };
  }

  function tryConnectIfComplete() {
    if (Object.keys(receivedChunks).length === totalChunks && totalChunks > 0) {
      // Alle chunks binnen, zet alles in volgorde aan elkaar
      let combined = "";
      for(let i=1; i<=totalChunks; i++) {
        combined += receivedChunks[i];
      }
      log("Alle QR codes ontvangen, decompressie...");

      const decompressed = LZString.decompressFromBase64(combined);
      if (!decompressed) {
        log("Fout bij decompressie");
        return;
      }
      try {
        const offer = JSON.parse(decompressed);
        setupConnection(offer);
      } catch (e) {
        log("Fout bij parsen JSON: " + e);
      }
    }
  }

  document.getElementById('startScan').onclick = () => {
    receivedChunks = {};
    totalChunks = 0;
    logElem.textContent = "";
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 280 },
      qrMessage => {
        // Verwacht: "index/total:data"
        const match = qrMessage.match(/^(\d+)\/(\d+):(.+)$/);
        if (!match) {
          log("Ongeldige QR code: " + qrMessage);
          return;
        }
        const [_, idxStr, totalStr, chunk] = match;
        const idx = parseInt(idxStr);
        const total = parseInt(totalStr);

        if (totalChunks === 0) {
          totalChunks = total;
          log(`Aantal QR codes te scannen: ${totalChunks}`);
        }

        if (receivedChunks[idx]) {
          log(`QR ${idx} al gescand`);
          return;
        }

        receivedChunks[idx] = chunk;
        log(`QR ${idx} ontvangen`);

        tryConnectIfComplete();
      },
      errorMessage => {
        // Optioneel: log scan fouten
      }
    );
  };

  document.getElementById('sendJump').onclick = () => {
    if(dc && dc.readyState === 'open') {
      dc.send("jump");
      log("Jump gestuurd");
    } else {
      log("DataChannel niet open");
    }
  };

  document.getElementById('sendAttack').onclick = () => {
    if(dc && dc.readyState === 'open') {
      dc.send("attack");
      log("Attack gestuurd");
    } else {
      log("DataChannel niet open");
    }
  };
</script>
</body>
</html>
