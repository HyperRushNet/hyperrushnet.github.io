<!DOCTYPE html>
<html>
<head><title>Controller (Peer 1)</title></head>
<body>
<h1>Controller (Peer 1)</h1>

<label>Offer + ICE 0/1-string (typen):</label><br>
<textarea id="offerBin" style="width:100%; height:150px;"></textarea><br><br>

<button id="connect">Verbind met offer</button><br><br>

<button id="sendJump">Jump</button>
<button id="sendAttack">Attack</button>

<p>Log:<br><pre id="log"></pre></p>

<script>
  let pc = null;
  let dc = null;
  const logElem = document.getElementById('log');

  function log(msg){
    logElem.textContent += msg + "\n";
  }

  function binToStr(bin) {
    let str = "";
    for(let i=0; i<bin.length; i+=8){
      let byte = bin.slice(i,i+8);
      str += String.fromCharCode(parseInt(byte, 2));
    }
    return str;
  }

  async function connectWithOffer(binStr) {
    try {
      const jsonStr = binToStr(binStr.trim());
      const data = JSON.parse(jsonStr);
      if(!data.sdp || !data.ice){
        log("Ongeldige data");
        return;
      }

      pc = new RTCPeerConnection({iceServers: []});
      dc = pc.createDataChannel("data");
      dc.onopen = () => log("DataChannel open!");
      dc.onmessage = e => log("Ontvangen: " + e.data);
      dc.onclose = () => log("DataChannel gesloten");

      await pc.setRemoteDescription(data.sdp);
      for(const c of data.ice){
        await pc.addIceCandidate(new RTCIceCandidate(c));
      }

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      log("Verbonden met offer, answer gemaakt");
    } catch(e){
      log("Fout bij verbinden: " + e);
    }
  }

  document.getElementById('connect').onclick = async () => {
    if(pc) {
      log("Al verbonden");
      return;
    }
    const binStr = document.getElementById('offerBin').value;
    if(!binStr.match(/^[01]+$/)){
      log("Voer alleen 0 en 1 in");
      return;
    }
    log("Verbinding maken...");
    await connectWithOffer(binStr);
  };

  document.getElementById('sendJump').onclick = () => {
    if(dc && dc.readyState === 'open') {
      dc.send("jump");
      log("Jump gestuurd");
    } else {
      log("DataChannel niet open");
    }
  };

  document.getElementById('sendAttack').onclick = () => {
    if(dc && dc.readyState === 'open') {
      dc.send("attack");
      log("Attack gestuurd");
    } else {
      log("DataChannel niet open");
    }
  };
</script>
</body>
</html>
