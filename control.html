<!DOCTYPE html>
<html>
<head>
  <title>Controller (Peer 1)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; font-family:sans-serif; text-align:center; }
    #reader { width:100%; max-width:400px; margin:auto; }
    button { margin:5px; padding:10px 20px; font-size:16px; }
  </style>
</head>
<body>

<h1>Controller</h1>
<div id="reader"></div>
<p id="output" style="white-space:pre-wrap;"></p>

<button onclick="startScan()">Scan QR</button>
<button onclick="stopScan()">Stop</button><br><br>
<button onclick="sendMsg('jump')">Jump</button>
<button onclick="sendMsg('attack')">Attack</button>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>

<script>
  let pc, dc, html5QrCode;

  function log(msg) {
    document.getElementById('output').textContent += msg + "\n";
  }

  async function setup(offerSDP) {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.ondatachannel = e => {
      dc = e.channel;
      dc.onopen = () => log("DataChannel open!");
      dc.onmessage = e => log("Ontvangen: " + e.data);
    };
    await pc.setRemoteDescription(offerSDP);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    log("Verbinden...");
  }

  function startScan() {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: { exact: "environment" } }, { fps: 10, qrbox: 250 },
      async qr => {
        stopScan();
        try {
          const offer = JSON.parse(LZString.decompressFromBase64(qr));
          await setup(offer);
        } catch (e) {
          log("Fout QR: " + e);
        }
      },
      err => {}
    ).catch(e => log("Camera fout: " + e));
  }

  function stopScan() {
    if (html5QrCode) html5QrCode.stop().catch(() => {});
  }

  function sendMsg(msg) {
    if (dc && dc.readyState === 'open') {
      dc.send(msg);
      log("Gestuurd: " + msg);
    } else {
      log("DataChannel niet open");
    }
  }
</script>
</body>
</html>
