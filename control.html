<!DOCTYPE html>
<html>
<head><title>Controller (Peer 1)</title></head>
<body>
<h1>Controller (Peer 1)</h1>

<button id="startScan">Start camera en scan QR-code</button><br><br>

<div id="reader" style="width:300px; height:300px; border:1px solid #ccc;"></div>

<p>Status:<br><pre id="log"></pre></p>

<script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
<script>
  const logElem = document.getElementById('log');
  function log(msg) { logElem.textContent += msg + "\n"; }

  let pc = null;
  let dc = null;

  function decodeCompact(str) {
    return atob(str.toUpperCase().replace(/p/g, '+').replace(/s/g, '/').replace(/e/g, '='));
  }

  async function setupConnection(data) {
    const { sdp, ice } = data;

    pc = new RTCPeerConnection({iceServers: []});

    pc.ondatachannel = e => {
      dc = e.channel;
      dc.onopen = () => log("DataChannel open!");
      dc.onmessage = ev => log("Ontvangen: " + ev.data);
      dc.onclose = () => log("DataChannel gesloten");
    };

    await pc.setRemoteDescription(sdp);

    for (const c of ice) {
      await pc.addIceCandidate(new RTCIceCandidate(c));
    }

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    pc.onicecandidate = e => {
      if(e.candidate) {
        // We kunnen hier eventueel candidates verzamelen en versturen, maar vaak is dat niet nodig als beide peers op hetzelfde netwerk zitten
        log("ICE candidate verzameld");
      }
    };

    log("Answer gemaakt en verbinding gestart");
  }

  document.getElementById('startScan').onclick = () => {
    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      qrCodeMessage => {
        log("QR-code gescand!");
        html5QrCode.stop();
        try {
          const jsonStr = decodeCompact(qrCodeMessage);
          const data = JSON.parse(jsonStr);
          if(!data.sdp || !data.ice) throw "Ongeldige data";
          setupConnection(data);
        } catch(e) {
          log("Fout bij decoderen QR: " + e);
        }
      },
      errorMessage => {
        // console.log("Scan error", errorMessage);
      }
    ).catch(err => log("Camera starten mislukt: " + err));
  };
</script>
</body>
</html>
