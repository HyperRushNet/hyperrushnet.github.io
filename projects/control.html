<!DOCTYPE html>
<html>
<head><title>Caller (Offer)</title></head>
<body>
  <h1>Caller (Offer maken)</h1>
  <video id="localVideo" autoplay muted playsinline style="width:320px; border:1px solid black"></video>
  
  <h3>Offer (kopieer naar Answerer)</h3>
  <textarea id="offerSDP" style="width:100%; height:150px;"></textarea>
  
  <h3>ICE candidates (kopieer naar Answerer)</h3>
  <textarea id="offerICE" style="width:100%; height:100px;"></textarea>
  
  <h3>Answer SDP (plak hier van Answerer)</h3>
  <textarea id="answerSDP" style="width:100%; height:150px;"></textarea>
  
  <h3>Answer ICE candidates (plak hier van Answerer)</h3>
  <textarea id="answerICE" style="width:100%; height:100px;"></textarea>
  
  <button id="setAnswer">Set answer + ICE</button>

  <script>
    const localVideo = document.getElementById('localVideo');
    const offerSDP = document.getElementById('offerSDP');
    const offerICE = document.getElementById('offerICE');
    const answerSDP = document.getElementById('answerSDP');
    const answerICE = document.getElementById('answerICE');
    const setAnswerBtn = document.getElementById('setAnswer');

    // RTCPeerConnection met Google STUN server
    const pc = new RTCPeerConnection({
      iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
    });

    let iceCandidatesFromLocal = [];
    let iceCandidatesFromRemote = [];

    // lokale video tonen
    navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(stream => {
      localVideo.srcObject = stream;
      stream.getTracks().forEach(track => pc.addTrack(track, stream));
      return pc.createOffer();
    })
    .then(offer => pc.setLocalDescription(offer))
    .then(() => {
      offerSDP.value = JSON.stringify(pc.localDescription);
    });

    // ICE candidates verzamelen en tonen
    pc.onicecandidate = e => {
      if(e.candidate){
        iceCandidatesFromLocal.push(e.candidate);
        offerICE.value = JSON.stringify(iceCandidatesFromLocal);
      }
    };

    setAnswerBtn.onclick = async () => {
      if(!answerSDP.value) return alert('Plak eerst answer SDP');
      if(!answerICE.value) return alert('Plak eerst answer ICE candidates');

      const remoteDesc = new RTCSessionDescription(JSON.parse(answerSDP.value));
      await pc.setRemoteDescription(remoteDesc);

      // Voeg alle remote ICE candidates toe
      const remoteCandidates = JSON.parse(answerICE.value);
      for(const c of remoteCandidates){
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c));
        } catch(e){
          console.warn('Fout bij toevoegen ICE candidate:', e);
        }
      }
      alert('Remote SDP en ICE toegevoegd!');
    };
  </script>
</body>
</html>
