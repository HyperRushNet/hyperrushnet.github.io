<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Push Notification Demo - HyperRushNet</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding:2rem;">
  <h1>Push Notification Demo</h1>
  <button id="notifyBtn" style="font-size:1.2rem; padding:0.5rem 1rem;">Toon notificatie</button>

  <script>
    const notifyBtn = document.getElementById('notifyBtn');

    notifyBtn.onclick = async () => {
      if (!("Notification" in window)) {
        alert("Push notificaties worden niet ondersteund in deze browser.");
        return;
      }

      if (Notification.permission === "granted") {
        showNotification();
      } else if (Notification.permission !== "denied") {
        const permission = await Notification.requestPermission();
        if (permission === "granted") showNotification();
        else alert("Notificatie toestemming geweigerd.");
      } else {
        alert("Notificatie toestemming is geweigerd.");
      }
    };

    function showNotification() {
      new Notification("Nieuwe game beschikbaar!", {
        body: "Speel nu de nieuwste game op HyperRushNet!",
        icon: "https://placehold.co/64x64/png?text=HRN" // plaats hier jouw eigen logo als je wil
      });
    }
  </script>
</body>
</html>
