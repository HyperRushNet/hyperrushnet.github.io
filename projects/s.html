<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Games filteren op device</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  select { font-size: 1rem; padding: 5px; margin-bottom: 20px; }
  .game { margin-bottom: 15px; }
  .game img { max-width: 150px; display: block; margin-bottom: 5px; }
</style>
</head>
<body>
<h1>Games filteren op device</h1>
<select id="deviceSelect">
  <option value="pc-no-touch">pc-no-touch</option>
  <option value="pc-touch" selected>pc-touch</option>
  <option value="phone">phone</option>
  <option value="tablet">tablet</option>
</select>
<div id="games">Laden...</div>
<script>
let allGames = [];

function filterGames(device) {
  const filtered = allGames.filter(g =>
    Array.isArray(g.device) ? g.device.includes(device) : g.device === device
  );
  const container = document.getElementById("games");
  container.innerHTML = "";
  if (filtered.length === 0) {
    container.textContent = "Geen games gevonden voor " + device + ".";
    return;
  }
  filtered.forEach(game => {
    const div = document.createElement("div");
    div.className = "game";
    div.innerHTML = `
      <img src="${game.img}" alt="${game.name}" />
      <strong>${game.name}</strong><br />
      <a href="${game.link}">Speel</a>
    `;
    container.appendChild(div);
  });
}

fetch("https://hyperrushnet.github.io/json/games.json")
  .then(r => r.json())
  .then(data => {
    allGames = data;
    filterGames(document.getElementById("deviceSelect").value);
  })
  .catch(() => {
    document.getElementById("games").textContent = "Fout bij laden games.";
  });

document.getElementById("deviceSelect").addEventListener("change", e => {
  filterGames(e.target.value);
});
</script>
</body>
</html>
