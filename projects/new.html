<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iframe redirect blocker + FPS</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000;
    color: #0f0;
    font-family: monospace;
  }
  #gameFrame {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    border: none;
  }
  #fpsCounter {
    position: fixed;
    top: 5px; right: 5px;
    background: rgba(0,0,0,0.7);
    color: #0f0;
    padding: 4px 8px;
    font-size: 14px;
    font-weight: bold;
    z-index: 9999;
    user-select: none;
  }
</style>
</head>
<body>

<iframe id="gameFrame" sandbox="allow-scripts allow-same-origin"></iframe>
<div id="fpsCounter">FPS: 0</div>

<script>
const iframe = document.getElementById('gameFrame');
const fpsCounter = document.getElementById('fpsCounter');
iframe.src = 'https://hyperrushnet.github.io/action-games/bacon-may-die/';

window.addEventListener('message', e => {
  if(e.source === iframe.contentWindow && e.data === 'redirect_attempt') {
    alert('Redirect binnen iframe geblokkeerd!');
  }
});

iframe.addEventListener('load', () => {
  try {
    const iw = iframe.contentWindow;
    const idoc = iframe.contentDocument || iw.document;
    if (!iw || !idoc) return;

    // Inject script dat redirect methods overschrijft en postMessage stuurt
    const script = idoc.createElement('script');
    script.textContent = `
      (function(){
        function notifyRedirect() {
          window.parent.postMessage('redirect_attempt', '*');
          alert('Redirect geblokkeerd door parent!');
        }
        // Override location assign/replace/href setter
        window.location.assign = function(url) { notifyRedirect(); };
        window.location.replace = function(url) { notifyRedirect(); };
        Object.defineProperty(window.location, 'href', {
          set: function(url) { notifyRedirect(); },
          get: function() { return window.location.toString(); }
        });
        // Override history API pushState/replaceState
        const origPush = history.pushState;
        history.pushState = function(state,title,url){
          notifyRedirect();
          return origPush.apply(this, arguments);
        };
        const origReplace = history.replaceState;
        history.replaceState = function(state,title,url){
          notifyRedirect();
          return origReplace.apply(this, arguments);
        };
      })();
    `;
    idoc.head.appendChild(script);
  } catch(e) {
    console.warn('Iframe injectie mislukt:', e);
  }
});

// FPS meter
let lastTime = performance.now();
let frames = 0;
function updateFPS() {
  const now = performance.now();
  frames++;
  if (now - lastTime >= 1000) {
    fpsCounter.textContent = 'FPS: ' + frames;
    frames = 0;
    lastTime = now;
  }
  requestAnimationFrame(updateFPS);
}
updateFPS();
</script>

</body>
</html>
