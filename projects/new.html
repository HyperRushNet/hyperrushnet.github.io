<!DOCTYPE html>
<html>
<head>
  <title>Iframe Loader + RedirectBlocker</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>

<script>
  // 👇 Hier verander je de URL van de game die in de iframe moet
  const iframeURL = "https://hyperrushnet.github.io/action-games/bacon-may-die/";

  // Voeg de iframe toe
  const iframe = document.createElement("iframe");
  iframe.id = "gameframe";
  iframe.src = iframeURL;
  iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
  document.body.appendChild(iframe);

  // De blocker als inline script (één lijn, MIT licensed)
  const scriptContent = `/*! RedirectBlocker v1.0 | MIT License */(()=>{const a=b=>alert("🔒 Redirect geblokkeerd: "+b),c=window.open;window.open=function(b,d,...e){return d&&(d.includes("_top")||d.includes("_parent"))?(a("window.open → "+d),null):c.apply(this,[b,d,...e])},location.assign=function(b){a("location.assign")},location.replace=function(b){a("location.replace")};const d=(b,c)=>{try{const d=Object.getOwnPropertyDescriptor(b,"location");(!d||d.configurable)&&Object.defineProperty(b,"location",{configurable:!0,enumerable:!0,get:()=>window.location,set:d=>{a(c+".location = "+d)}})}catch(e){}};d(window,"window"),d(top,"top"),d(parent,"parent"),document.addEventListener("click",b=>{let c=b.target;for(;c&&c!==document;){if("A"===c.tagName&&c.href){a("<a href>"),b.preventDefault();break}c=c.parentNode}},!0)})();`;

  // Injecteer script na load
  iframe.addEventListener("load", () => {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      const script = doc.createElement("script");
      script.textContent = scriptContent;
      doc.head.appendChild(script);
    } catch (e) {
      console.warn("Script injectie mislukt:", e);
    }
  });
</script>

</body>
</html>
