<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Veilige Game Embed</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const iframe = document.createElement("iframe");
    iframe.src = "https://hyperrushnet.github.io/action-games/bacon-may-die/";
    iframe.setAttribute("sandbox", "allow-scripts allow-same-origin"); // top-navigation geblokkeerd
    iframe.setAttribute("allowfullscreen", "true");

    document.getElementById("game-container").appendChild(iframe);

    // Detecteer redirectpogingen via window blur (soms veroorzaakt door poging tot top redirect)
    let lastFocus = Date.now();
    window.onblur = () => {
      setTimeout(() => {
        if (document.activeElement === document.body && Date.now() - lastFocus < 1000) {
          alert("Redirect blocked!");
        }
      }, 200);
    };

    // Detecteer DOM-wijzigingen aan iframe (sommige engines proberen iframe te vervangen bij redirect)
    const observer = new MutationObserver((mutations) => {
      for (const m of mutations) {
        for (const n of m.removedNodes) {
          if (n === iframe) {
            alert("Redirect attempt blocked!");
          }
        }
      }
    });

    observer.observe(document.getElementById("game-container"), { childList: true });

    // Prevent window.open global
    const originalOpen = window.open;
    window.open = function () {
      alert("Redirect blocked!");
      return null;
    };
  </script>
</body>
</html>
