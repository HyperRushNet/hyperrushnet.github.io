<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iframe met redirect blokker</title>
<style>
  html, body {
    margin:0; padding:0; height:100%; overflow:hidden;
  }
  iframe {
    position:fixed; top:0; left:0; width:100vw; height:100vh; border:none;
  }
</style>
</head>
<body>

<iframe id="gameFrame" src="https://hyperrushnet.github.io/action-games/bacon-may-die/"></iframe>

<script>
  const iframe = document.getElementById('gameFrame');
  const iframeWindow = iframe.contentWindow;

  // Zet sandbox aan als je wilt, of laat weg als je volledige controle wilt
  // iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin'); // optioneel

  // Override navigatie functies in iframe om redirects te blokkeren
  function preventRedirect(win) {
    // Overschrijven van top navigatie
    Object.defineProperty(win, 'top', {
      get() { return win; } // voorkomen dat iframe naar parent gaat
    });

    // Overschrijven van location assign, replace, href set
    const blockMsg = "Redirect blocked!";
    ['assign','replace'].forEach(fn => {
      const original = win.location[fn];
      win.location[fn] = function(url) {
        alert(blockMsg);
        console.log(blockMsg, url);
      };
    });

    // Proxies om href set te onderscheppen
    Object.defineProperty(win.location, 'href', {
      set(url) {
        alert(blockMsg);
        console.log(blockMsg, url);
      },
      get() {
        return win.location.toString();
      },
      configurable: true
    });

    // Overschrijven van window.open
    win.open = function() {
      alert(blockMsg);
      console.log(blockMsg, arguments);
      return null;
    };

    // Overschrijven van navigation via form submit (als mogelijk)
    // Kan complex zijn, dus niet standaard hier

  }

  // Wacht tot iframe geladen is en pas preventRedirect toe
  iframe.addEventListener('load', () => {
    try {
      preventRedirect(iframe.contentWindow);
    } catch(e) {
      console.warn('Kan iframe window niet aanpassen:', e);
    }
  });

</script>

</body>
</html>
