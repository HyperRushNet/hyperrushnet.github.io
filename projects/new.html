<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Veilige Game Embed</title>
  <script src="/js/hrn-notifications.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    // De URL van je spel
    const game = {
      link: "https://hyperrushnet.github.io/action-games/bacon-may-die/"
    };

    // Creëer sandboxed iframe ZONDER redirect-permissies
    const iframe = document.createElement("iframe");
    iframe.src = game.link;
    iframe.setAttribute("sandbox", "allow-scripts allow-same-origin"); // geen top-navigation!
    iframe.setAttribute("allowfullscreen", "true");
    document.getElementById("game-container").appendChild(iframe);

    // Blokkeer alle pogingen tot window.open
    const originalOpen = window.open;
    window.open = function (url, target, features) {
      if (window.hrn?.notifications) {
        hrn.notifications.show("Redirect blocked!", "info", "2500");
      }
      return null;
    };

    // Blokkeer alle pogingen tot window.location-verandering in parent
    Object.defineProperty(window, 'location', {
      configurable: false,
      enumerable: true,
      get: () => location,
      set: (val) => {
        if (window.hrn?.notifications) {
          hrn.notifications.show("Redirect blocked!", "info", "2500");
        }
      }
    });

    // Extra beveiliging: observer die navigatiepogingen binnen iframe detecteert
    iframe.addEventListener("load", () => {
      try {
        const iframeWin = iframe.contentWindow;

        // Override binnen iframe als same-origin
        if (iframeWin && iframeWin !== window) {
          iframeWin.open = function () {
            if (window.hrn?.notifications) {
              hrn.notifications.show("Redirect blocked!", "info", "2500");
            }
            return null;
          };

          Object.defineProperty(iframeWin, 'location', {
            configurable: false,
            enumerable: true,
            get: () => iframeWin.location,
            set: () => {
              if (window.hrn?.notifications) {
                hrn.notifications.show("Redirect blocked!", "info", "2500");
              }
            }
          });
        }
      } catch (e) {
        // Cross-origin iframe: geen toegang, maar sandbox voorkomt redirect sowieso
      }
    });
  </script>
</body>
</html>
