<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veilige Game</title>
  <script src="/js/hrn-notifications.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const game = {
      link: "https://hyperrushnet.github.io/action-games/bacon-may-die/"
    };

    const iframe = document.createElement("iframe");
    iframe.src = game.link;
    iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
    iframe.setAttribute("allowfullscreen", "true");
    document.getElementById("game-container").appendChild(iframe);

    // Blokkeer window.open wereldwijd
    const originalOpen = window.open;
    window.open = function (url, target, features) {
      if (window.hrn?.notifications) {
        hrn.notifications.show("Redirect blocked!", "info", "2500");
      }
      return null;
    };

    // Blokkeer window.location (extern redirect)
    Object.defineProperty(window, 'location', {
      configurable: false,
      enumerable: true,
      get: () => location,
      set: (val) => {
        if (window.hrn?.notifications) {
          hrn.notifications.show("Redirect blocked!", "info", "2500");
        }
      }
    });

    // Probeer ook binnen iframe redirect via open/location te blokkeren (alleen same-origin)
    iframe.addEventListener("load", () => {
      try {
        const frameWin = iframe.contentWindow;
        if (frameWin && frameWin !== window) {
          frameWin.open = function () {
            if (window.hrn?.notifications) {
              hrn.notifications.show("Redirect blocked!", "info", "2500");
            }
            return null;
          };

          Object.defineProperty(frameWin, 'location', {
            configurable: false,
            enumerable: true,
            get: () => frameWin.location,
            set: () => {
              if (window.hrn?.notifications) {
                hrn.notifications.show("Redirect blocked!", "info", "2500");
              }
            }
          });
        }
      } catch (e) {
        // Cross-origin? Geen toegang, maar sandbox dekt het.
      }
    });
  </script>
</body>
</html>
