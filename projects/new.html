<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iframe redirect blocker</title>
<style>
  html, body {
    margin:0; padding:0; height:100%;
    overflow:hidden;
  }
  #gameFrame {
    position:fixed;
    top:0; left:0; width:100%; height:100%;
    border:none;
  }
</style>
</head>
<body>

<iframe id="gameFrame" sandbox="allow-scripts allow-same-origin"></iframe>

<script>
const iframe = document.getElementById('gameFrame');

// URL in iframe (zelfde domein of CORS toestaan nodig voor injectie)
iframe.src = 'https://hyperrushnet.github.io/action-games/bacon-may-die/';

window.addEventListener('message', e => {
  if (e.source === iframe.contentWindow && e.data === 'redirect_attempt') {
    alert('Redirect binnen iframe geblokkeerd!');
  }
});

iframe.addEventListener('load', () => {
  try {
    const iw = iframe.contentWindow;
    const idoc = iframe.contentDocument || iw.document;
    if (!iw || !idoc) return;

    // Script om redirects te blokkeren en parent te waarschuwen
    const script = idoc.createElement('script');
    script.textContent = `
      (function(){
        function notifyRedirect() {
          window.parent.postMessage('redirect_attempt', '*');
          alert('Redirect geblokkeerd door parent!');
        }
        window.location.assign = function(url) { notifyRedirect(); };
        window.location.replace = function(url) { notifyRedirect(); };
        Object.defineProperty(window.location, 'href', {
          set: function(url) { notifyRedirect(); },
          get: function() { return window.location.toString(); }
        });
        const origPush = history.pushState;
        history.pushState = function(state,title,url){
          notifyRedirect();
          return origPush.apply(this, arguments);
        };
        const origReplace = history.replaceState;
        history.replaceState = function(state,title,url){
          notifyRedirect();
          return origReplace.apply(this, arguments);
        };
      })();
    `;
    idoc.head.appendChild(script);
  } catch(e) {
    console.warn('Iframe injectie mislukt:', e);
  }
});
</script>

</body>
</html>
