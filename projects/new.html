<!DOCTYPE html>
<html>
<head>
  <title>Secure Sandbox</title>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: black;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
  <script src="/js/hrn-notifications.min.js"></script>
</head>
<body>
  <iframe id="game" sandbox="allow-scripts allow-same-origin" src="https://hyperrushnet.github.io/action-games/bacon-may-die/"></iframe>

  <script>
    const iframe = document.getElementById("game");

    iframe.onload = () => {
      try {
        const win = iframe.contentWindow;

        // 🔒 Blokkeer redirect via top.*
        if (win && win.top !== window) {
          Object.defineProperty(win, 'top', {
            get() {
              if (typeof hrn !== "undefined") {
                hrn.notifications.show("Redirect blocked!", "info", "2500");
              }
              return new Proxy(window, {
                get(target, prop) {
                  if (typeof hrn !== "undefined") {
                    hrn.notifications.show("Redirect blocked!", "info", "2500");
                  }
                  return typeof target[prop] === 'function' ? () => {} : null;
                },
                set() {
                  if (typeof hrn !== "undefined") {
                    hrn.notifications.show("Redirect blocked!", "info", "2500");
                  }
                  return true;
                }
              });
            }
          });
        }

        // 🎮 Injecteer FPS-meter
        const doc = win.document;
        const fpsBox = doc.createElement("div");
        fpsBox.style.cssText = `
          position:fixed;top:8px;left:8px;background:rgba(0,0,0,0.6);
          color:#0f0;font:14px monospace;padding:4px 8px;z-index:9999;
          pointer-events:none;user-select:none;border-radius:4px;
        `;
        fpsBox.textContent = "FPS: --";
        doc.body.appendChild(fpsBox);

        let lastTime = performance.now(), frames = 0;
        function updateFPS() {
          const now = performance.now();
          frames++;
          if (now - lastTime >= 1000) {
            fpsBox.textContent = "FPS: " + frames;
            frames = 0;
            lastTime = now;
          }
          win.requestAnimationFrame(updateFPS);
        }
        win.requestAnimationFrame(updateFPS);
      } catch (e) {
        console.warn("FPS meter of redirect blocker mislukt:", e);
      }
    };
  </script>
</body>
</html>
