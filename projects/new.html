<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veilige Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const game = {
      link: "https://hyperrushnet.github.io/action-games/bacon-may-die/"
    };

    const iframe = document.createElement("iframe");
    iframe.src = game.link;
    iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
    iframe.setAttribute("allowfullscreen", "true");
    document.getElementById("game-container").appendChild(iframe);

    // Redirect via window.open blokkeren
    const originalOpen = window.open;
    window.open = function (url, target, features) {
      alert("Redirect blocked!");
      return null;
    };

    // Redirect via window.location blokkeren
    Object.defineProperty(window, 'location', {
      configurable: false,
      enumerable: true,
      get: () => location,
      set: (val) => {
        alert("Redirect blocked!");
      }
    });

    // Probeer redirectpoging binnen iframe ook te vangen (same-origin only)
    iframe.addEventListener("load", () => {
      try {
        const frameWin = iframe.contentWindow;
        if (frameWin && frameWin !== window) {
          frameWin.open = function () {
            alert("Redirect blocked!");
            return null;
          };

          Object.defineProperty(frameWin, 'location', {
            configurable: false,
            enumerable: true,
            get: () => frameWin.location,
            set: () => {
              alert("Redirect blocked!");
            }
          });
        }
      } catch (e) {
        // Cross-origin iframe: sandbox voorkomt redirect al
      }
    });
  </script>
</body>
</html>
