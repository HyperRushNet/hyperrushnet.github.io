<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Loading... - HyperRush</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- STIJL -->
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #000;
      width: 100%; height: 100%;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }
    #wrapper {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      display: block;
    }
  </style>

  <!-- CSP die extern script toestaat -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; img-src * data:; frame-ancestors 'none';" />
</head>
<body>
  <div id="wrapper">Loading...</div>

  <!-- Extern script, zie hieronder -->
  <script src="./loader.js"></script>
</body>
</html>
