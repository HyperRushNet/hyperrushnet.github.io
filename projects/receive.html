<!DOCTYPE html>
<html>
<head><title>Answerer (Answer maken)</title></head>
<body>
  <h1>Answerer (Answer maken)</h1>
  <video id="remoteVideo" autoplay playsinline style="width:320px; border:1px solid black"></video>
  
  <h3>Offer SDP (plak hier van Caller)</h3>
  <textarea id="offerSDP" style="width:100%; height:150px;"></textarea>
  
  <h3>Offer ICE candidates (plak hier van Caller)</h3>
  <textarea id="offerICE" style="width:100%; height:100px;"></textarea>
  
  <h3>Answer SDP (kopieer naar Caller)</h3>
  <textarea id="answerSDP" style="width:100%; height:150px;"></textarea>
  
  <h3>Answer ICE candidates (kopieer naar Caller)</h3>
  <textarea id="answerICE" style="width:100%; height:100px;"></textarea>
  
  <button id="createAnswer">Create answer</button>

  <script>
    const remoteVideo = document.getElementById('remoteVideo');
    const offerSDP = document.getElementById('offerSDP');
    const offerICE = document.getElementById('offerICE');
    const answerSDP = document.getElementById('answerSDP');
    const answerICE = document.getElementById('answerICE');
    const createAnswerBtn = document.getElementById('createAnswer');

    const pc = new RTCPeerConnection({
      iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
    });

    let iceCandidatesFromLocal = [];
    let iceCandidatesFromRemote = [];

    pc.ontrack = e => {
      remoteVideo.srcObject = e.streams[0];
    };

    createAnswerBtn.onclick = async () => {
      if(!offerSDP.value) return alert('Plak eerst offer SDP');
      if(!offerICE.value) return alert('Plak eerst offer ICE candidates');

      const offerDesc = new RTCSessionDescription(JSON.parse(offerSDP.value));
      await pc.setRemoteDescription(offerDesc);

      // Voeg alle remote ICE candidates toe
      const remoteCandidates = JSON.parse(offerICE.value);
      for(const c of remoteCandidates){
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c));
        } catch(e){
          console.warn('Fout bij toevoegen ICE candidate:', e);
        }
      }

      const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
      stream.getTracks().forEach(track => pc.addTrack(track, stream));

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      answerSDP.value = JSON.stringify(pc.localDescription);
    };

    pc.onicecandidate = e => {
      if(e.candidate){
        iceCandidatesFromLocal.push(e.candidate);
        answerICE.value = JSON.stringify(iceCandidatesFromLocal);
      }
    };
  </script>
</body>
</html>
