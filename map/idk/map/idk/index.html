<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Domain Detector Demo</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f7f7f7;
    }
    code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>🌐 Domein Informatie</h1>
  <ul>
    <li><strong>Volledige Hostname:</strong> <code id="fullHost"></code></li>
    <li><strong>Subdomein:</strong> <code id="subdomain"></code></li>
    <li><strong>Domein:</strong> <code id="domain"></code></li>
    <li><strong>TLD:</strong> <code id="tld"></code></li>
    <li><strong>Productieomgeving:</strong> <code id="isProd"></code></li>
    <li><strong>Localhost:</strong> <code id="isLocalhost"></code></li>
  </ul>

  <script>
    const domainDetector = (() => {
      const fullHost = window.location.hostname;
      const parts = fullHost.split('.');
      const subdomains = parts.length > 2 ? parts.slice(0, -2).join('.') : null;
      const domain = parts.slice(-2).join('.');
      const tld = parts.pop();

      return {
        getFullHost() {
          return fullHost;
        },
        getSubdomain() {
          return subdomains;
        },
        getDomain() {
          return domain;
        },
        getTLD() {
          return tld;
        },
        isProduction() {
          const prodList = ['hyperrushnet.com', 'myapp.com'];
          return prodList.includes(domain);
        },
        isLocalhost() {
          return fullHost === 'localhost' || fullHost === '127.0.0.1';
        },
        isSubdomainOf(baseDomain) {
          return domain === baseDomain && !!subdomains;
        }
      };
    })();

    // Output naar pagina
    document.getElementById('fullHost').textContent = domainDetector.getFullHost();
    document.getElementById('subdomain').textContent = domainDetector.getSubdomain() || '(geen)';
    document.getElementById('domain').textContent = domainDetector.getDomain();
    document.getElementById('tld').textContent = domainDetector.getTLD();
    document.getElementById('isProd').textContent = domainDetector.isProduction() ? 'Ja' : 'Nee';
    document.getElementById('isLocalhost').textContent = domainDetector.isLocalhost() ? 'Ja' : 'Nee';

    // Console log voor devs
    console.log("Domain info:", {
      fullHost: domainDetector.getFullHost(),
      subdomain: domainDetector.getSubdomain(),
      domain: domainDetector.getDomain(),
      tld: domainDetector.getTLD(),
      isProduction: domainDetector.isProduction(),
      isLocalhost: domainDetector.isLocalhost()
    });
  </script>
</body>
</html>
