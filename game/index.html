<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading - HyperRushNet</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
      color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #121212;
        color: #fff;
      }
    }
  </style>
</head>
<body>
<script src="/assets/js/faviconchanger.min.js" defer></script>
<script>
(async () => {
  const redirect = () => location.href = "/";

  // → Get game number from hash like #/1
  const hash = location.hash.slice(1); // "/1"
  const parts = hash.split("/");
  const nr = parseInt(parts[1]);
  if (!nr || isNaN(nr)) return redirect();

  let games;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    const res = await fetch("/assets/json/games.json", { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) throw new Error("Invalid response");
    games = await res.json();
  } catch (err) {
    console.error("Failed to load games.json:", err);
    return redirect();
  }

  const game = games.find(g => g.number === nr);
  if (!game) return redirect();

  document.title = `${game.name} - HyperRush`;

  const iframe = document.createElement("iframe");
  iframe.loading = "eager";
  iframe.src = game.link;
  iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
  iframe.onerror = () => redirect();
  document.body.appendChild(iframe);

  const blockerScript = `/*! RedirectBlocker v1.1 | MIT */(()=>{const a=b=>window.hrn?.notifications?.show("Redirect blocked!","info","3000"),c=window.open;window.open=function(b,d,...e){return d&&(d.includes("_top")||d.includes("_parent"))?(a("window.open → "+d),null):c.apply(this,[b,d,...e])},location.assign=function(b){a("location.assign")},location.replace=function(b){a("location.replace")};const d=(b,c)=>{try{const d=Object.getOwnPropertyDescriptor(b,"location");(!d||d.configurable)&&Object.defineProperty(b,"location",{configurable:!0,enumerable:!0,get:()=>window.location,set:d=>{a(c+".location = "+d)}})}catch(e){}};d(window,"window"),d(top,"top"),d(parent,"parent"),document.addEventListener("click",b=>{let c=b.target;for(;c&&c!==document;){if("A"===c.tagName&&c.href){a("<a href>"),b.preventDefault();break}c=c.parentNode}},!0)})();`;

  iframe.onload = () => {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow?.document;
      if (!doc || !doc.head) throw new Error("iframe document not accessible");

      const notifyScript = doc.createElement("script");
      notifyScript.src = "/assets/js/hrn-notifications.min.js";
      notifyScript.onload = () => {
        try {
          const blocker = doc.createElement("script");
          blocker.textContent = blockerScript;
          doc.head.appendChild(blocker);
        } catch (err) {
          console.warn("Blocker injection failed:", err);
        }
      };
      notifyScript.onerror = () => console.warn("Notification script failed to load");
      doc.head.appendChild(notifyScript);
    } catch (err) {
      console.warn("Injection error:", err);
    }
  };
})();
</script>
</body>
</html>
