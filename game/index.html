<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Game Player</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
  }
  #iframeContainer {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
  }
  iframe {
    border: none;
    width: 100%;
    height: 100%;
    background: #000;
  }
  #errorMsg {
    padding: 20px;
    text-align: center;
    font-size: 1.5rem;
    margin-top: 50px;
  }
</style>
</head>
<body>

<div id="iframeContainer"></div>
<div id="errorMsg" style="display:none;"></div>

<script>
  const iframeContainer = document.getElementById('iframeContainer');
  const errorMsg = document.getElementById('errorMsg');

  function getGameNumberFromHash() {
    return window.location.hash ? window.location.hash.substring(1) : null;
  }

  function showError(msg) {
    iframeContainer.style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.textContent = msg;
  }

  async function loadGame() {
    const gameNumber = getGameNumberFromHash();
    if (!gameNumber) {
      showError('Geen game nummer opgegeven in de URL.');
      return;
    }

    try {
      const res = await fetch('https://hyperrushnet.github.io/json/games.json');
      if (!res.ok) throw new Error('Kon games.json niet laden.');

      const games = await res.json();
      const game = games.find(g => String(g.number) === gameNumber);
      if (!game) {
        showError('Game met nummer ' + gameNumber + ' niet gevonden.');
        return;
      }

      const iframe = document.createElement('iframe');
      iframe.src = game.url;
      iframe.title = `Game: ${game.name}`;
      iframe.loading = 'lazy';

      iframeContainer.appendChild(iframe);
    } catch (err) {
      showError('Fout bij laden van de game: ' + err.message);
    }
  }

  window.addEventListener('hashchange', () => {
    iframeContainer.innerHTML = '';
    errorMsg.style.display = 'none';
    loadGame();
  });

  loadGame();
</script>

</body>
</html>
