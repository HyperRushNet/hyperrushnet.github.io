<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/images/favicon/000000.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/assets/images/favicon/ffffff.png" media="(prefers-color-scheme: dark)">
  <title>Loading - HyperRushNet</title>
  <script src="/assets/js/notranslate.min.js"></script>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #fff; color: #000; position: relative;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: none;
    }
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: inherit; z-index: 9999;
    }
    #loader div {
      width: 40px; height: 40px;
      border: 4px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #redirect-block-notice {
      position: fixed;
      top: 10px;
      right: 0;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 6px 12px;
      border-radius: 4px 0 0 4px;
      font-size: 12px;
      opacity: 1;
      pointer-events: none;
      transform: translateX(100%);
      transition: none;
      z-index: 10000;
      user-select: none;
    }
    #redirect-block-notice.show {
      animation: slideInRight 0.4s forwards, slideOutRight 0.4s forwards 2.6s;
      pointer-events: auto;
    }
    @keyframes slideInRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    @keyframes slideOutRight {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #121212;
        color: #fff;
      }
      #redirect-block-notice {
        background: rgba(255, 255, 255, 0.85);
        color: #121212;
      }
    }
  </style>
</head>
<body>
  <div id="loader"><div></div></div>
  <div id="redirect-block-notice" aria-live="polite" role="alert">Redirect block: ON</div>
  <script>
    (() => {
      const loader = document.getElementById('loader');
      const notice = document.getElementById('redirect-block-notice');
      let iframe = null;
      let games = null;

      // Show the notification with slide-in/out animation
      const showNotice = (msg) => {
        notice.textContent = msg;
        // Remove & re-add class to retrigger animation
        notice.classList.remove('show');
        void notice.offsetWidth; // trigger reflow
        notice.classList.add('show');
      };

      // Inject scripts into the iframe to control FPS, pause, logs etc.
      const injectScriptsIntoIframe = (iframe) => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if (!doc || !doc.head) return;

          const scripts = [];

          // Disable console logs inside iframe
          const disableLogsScript = doc.createElement('script');
          disableLogsScript.textContent = `
            console.log = console.debug = console.warn = console.error = () => {};
          `;
          scripts.push(disableLogsScript);

          // Cap FPS at ~60
          const capFPSScript = doc.createElement('script');
          capFPSScript.textContent = `
            let last = 0;
            function loop(timestamp) {
              if (timestamp - last > 16) {
                if (window.__updateGame) window.__updateGame();
                if (window.__renderGame) window.__renderGame();
                last = timestamp;
              }
              requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
          `;
          scripts.push(capFPSScript);

          // Pause/resume game on tab visibility change
          const visibilityScript = doc.createElement('script');
          visibilityScript.textContent = `
            document.addEventListener('visibilitychange', () => {
              if (document.hidden) {
                if (window.__pauseGame) window.__pauseGame();
              } else {
                if (window.__resumeGame) window.__resumeGame();
              }
            });
          `;
          scripts.push(visibilityScript);

          // Passive event listeners fix for performance
          const passiveEventsScript = doc.createElement('script');
          passiveEventsScript.textContent = `
            ['touchstart', 'touchmove', 'wheel'].forEach(event => {
              window.addEventListener(event, () => {}, { passive: true });
            });
          `;
          scripts.push(passiveEventsScript);

          scripts.forEach(s => doc.head.appendChild(s));

        } catch (error) {
          console.warn('Failed to inject scripts into iframe:', error);
        }
      };

      // Redirect home fallback
      const redirectToHome = () => {
        window.location.href = '/';
      };

      // Load the game from hash in URL
      const loadGame = async () => {
        const hash = window.location.hash.slice(1).split('/')[1];
        const gameNumber = parseInt(hash, 10);
        if (!gameNumber || isNaN(gameNumber)) return redirectToHome();

        if (!games) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            const response = await fetch('/assets/json/games.json', { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) throw new Error('Failed to fetch games.json');
            games = await response.json();
          } catch (error) {
            console.error('Error loading games.json:', error);
            return redirectToHome();
          }
        }

        const game = games.find(g => g.number === gameNumber);
        if (!game) return redirectToHome();

        document.title = `${game.name} - HyperRush`;

        if (iframe) {
          iframe.remove();
          iframe = null;
        }

        iframe = document.createElement('iframe');
        iframe.src = game.link;
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');

        iframe.onload = () => {
          injectScriptsIntoIframe(iframe);
          iframe.style.display = 'block';
          loader.style.display = 'none';
          showNotice('Redirect block is active');
        };

        iframe.onerror = () => {
          redirectToHome();
        };

        document.body.appendChild(iframe);
      };

      window.addEventListener('hashchange', loadGame);

      // Initial load
      loadGame();
    })();
  </script>
</body>
</html>
