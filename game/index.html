<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading Game..</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #111;
      display: block;
    }
    #error {
      color: white;
      text-align: center;
      padding: 40px;
      font-family: sans-serif;
      font-size: 1.5em;
    }
  </style>
  <script src="/js/faviconchanger.js" async></script>
  <script src="/js/hrn-notifications.min.js" async></script>
</head>
<body>

<iframe id="gameFrame" loading="lazy" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups" referrerpolicy="no-referrer"></iframe>
<div id="error" style="display: none;"></div>

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const nr = params.get('nr');
  const errorBox = document.getElementById('error');
  const iframe = document.getElementById('gameFrame');

  if (!nr || isNaN(nr)) {
    iframe.remove();
    errorBox.style.display = 'block';
    errorBox.textContent = 'Geen geldig game-nummer opgegeven.';
    return;
  }

  try {
    const res = await fetch('/json/games.json', { cache: "no-store" });
    const games = await res.json();
    const game = games.find(g => String(g.number) === nr);

    if (!game) {
      iframe.remove();
      errorBox.style.display = 'block';
      errorBox.textContent = 'Game niet gevonden.';
      return;
    }

    document.title = `${game.name} - The HyperRush Network`;

    // Externe redirects kunnen niet werken → sandbox blokkeert
    const url = new URL(game.link, location.origin);
    const isExternal = url.host !== location.host;

    iframe.src = game.link;

    // Detecteer redirect poging
    setTimeout(() => {
      try {
        const frameLoc = iframe.contentWindow.location.href;
        if (isExternal && frameLoc !== url.href) {
          hrn?.notifications?.show?.("Redirect blocked!", "info", "2500");
        }
      } catch (err) {
        // Cross-origin → redirect geblokkeerd
        hrn?.notifications?.show?.("Redirect blocked!", "info", "2500");
      }
    }, 1500);
    
  } catch (e) {
    console.error(e);
    iframe.remove();
    errorBox.style.display = 'block';
    errorBox.textContent = 'Fout bij het laden van de game.';
  }
})();
</script>

</body>
</html>
