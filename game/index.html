<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading Game..</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #111;
    }
    #error {
      color: white;
      text-align: center;
      padding: 40px;
      font-family: sans-serif;
      font-size: 1.5em;
    }
  </style>

</head>
  <script src="/js/faviconchanger.js"></script>
<body>

<iframe id="gameFrame" loading="lazy"></iframe>
<div id="error" style="display: none;"></div>

<script>
  (async () => {
    const params = new URLSearchParams(location.search);
    const nr = params.get('nr');
    const errorBox = document.getElementById('error');
    const iframe = document.getElementById('gameFrame');

    if (!nr || isNaN(nr)) {
      iframe.remove();
      errorBox.style.display = 'block';
      errorBox.textContent = 'Geen geldig game-nummer opgegeven.';
      return;
    }

    try {
      const res = await fetch('/json/games.json');
      const games = await res.json();
      const game = games.find(g => String(g.number) === nr);

      if (!game) {
        iframe.remove();
        errorBox.style.display = 'block';
        errorBox.textContent = 'Game niet gevonden.';
        return;
      }

      document.title = `${game.name} - The HyperRush Network`;
      iframe.src = game.link;
    } catch (e) {
      console.error(e);
      iframe.remove();
      errorBox.style.display = 'block';
      errorBox.textContent = 'Fout bij het laden van de game.';
    }
  })();
</script>

</body>
</html>
