<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Loader</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }
    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #111;
    }
    #error {
      color: white;
      font-size: 1.5em;
      text-align: center;
      padding: 50px;
    }
  </style>
</head>
<body>

<iframe id="gameFrame" loading="lazy"></iframe>
<div id="error" style="display:none;"></div>

<script>
  function getNumberFromQuery() {
    const raw = location.search; // e.g. ?123
    if (!raw || !raw.startsWith('?')) return null;
    const number = raw.substring(1);
    return /^\d+$/.test(number) ? number : null;
  }

  async function loadGame() {
    const number = getNumberFromQuery();
    const iframe = document.getElementById("gameFrame");
    const error = document.getElementById("error");

    if (!number) {
      iframe.style.display = "none";
      error.style.display = "block";
      error.textContent = "Geen geldig nummer in URL (gebruik: /game/?123)";
      return;
    }

    try {
      const res = await fetch("https://hyperrushnet.github.io/json/games.json");
      const games = await res.json();
      const game = games.find(g => String(g.number) === number);
      if (!game) {
        iframe.style.display = "none";
        error.style.display = "block";
        error.textContent = `Game met nummer ${number} niet gevonden.`;
        return;
      }

      iframe.src = game.url;
    } catch (err) {
      iframe.style.display = "none";
      error.style.display = "block";
      error.textContent = "Fout bij laden van game data.";
    }
  }

  loadGame();
</script>

</body>
</html>
