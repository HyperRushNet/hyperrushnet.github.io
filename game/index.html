<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Loading... - HyperRush</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }
    #wrapper {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="wrapper">Loading...</div>

  <script>
    // Polyfills
    if (!window.requestAnimationFrame) {
      window.requestAnimationFrame = function(cb) {
        return setTimeout(cb, 16);
      };
    }
    if (!window.performance) window.performance = {};
    if (!performance.now) {
      performance.now = function() { return Date.now(); };
    }

    // Query param helper
    function getQueryParam(name) {
      var match = RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
      return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
    }

    var nr = getQueryParam("nr");
    var wrapper = document.getElementById("wrapper");

    if (!nr) {
      wrapper.innerHTML = '⚠️ No game number provided.<br><br>Use e.g.: <code>?nr=1</code>';
      document.title = 'No game - HyperRush';
    } else {
      nr = parseInt(nr, 10);
      if (isNaN(nr) || nr < 1) {
        wrapper.innerHTML = '⚠️ Invalid game number.<br><br>Use a positive number like <code>?nr=1</code>';
        document.title = 'Invalid game - HyperRush';
      } else {
        fetch('/json/games.json')
          .then(res => {
            if (!res.ok) throw new Error('Could not load JSON');
            return res.json();
          })
          .then(games => {
            var game = games.find(g => g.number === nr);
            if (!game) {
              wrapper.innerHTML = '⚠️ No game found with number ' + nr + '.';
              document.title = 'Game not found - HyperRush';
              return;
            }
            document.title = game.name + ' - HyperRush';

            // Validate link
            if (typeof game.link !== 'string' || !game.link.startsWith('/') || game.link.includes('..')) {
              wrapper.innerHTML = '⚠️ Invalid game link.';
              document.title = 'Invalid game - HyperRush';
              return;
            }

            var iframe = document.createElement('iframe');
            iframe.src = game.link;
            iframe.width = "100%";
            iframe.height = "100%";
            iframe.setAttribute("allowfullscreen", "true");
            iframe.setAttribute("loading", "eager");
            // Sandbox with allow-scripts and allow-same-origin but disallow top-navigation
            iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");

            wrapper.innerHTML = '';
            wrapper.appendChild(iframe);

            // Prevent iframe from redirecting parent (top) window
            window.addEventListener('message', e => {
              // Optional: You can check e.origin if needed
              if (e.data === 'redirectParent') {
                // Ignore or prevent
                console.warn('Blocked attempt to redirect parent from iframe.');
              }
            });

            // Inject FPS meter
            iframe.onload = function() {
              try {
                var doc = iframe.contentDocument || iframe.contentWindow.document;
                var win = iframe.contentWindow;

                var fpsBox = doc.createElement('div');
                fpsBox.style.cssText = `
                  position:fixed;top:8px;left:8px;background:rgba(0,0,0,0.6);
                  color:#0f0;font:14px monospace;padding:4px 8px;z-index:9999;
                  pointer-events:none;user-select:none;border-radius:4px;
                `;
                fpsBox.textContent = 'FPS: --';
                doc.body.appendChild(fpsBox);

                var lastTime = performance.now(), frames = 0;
                function updateFPS() {
                  var now = performance.now();
                  frames++;
                  if (now - lastTime >= 1000) {
                    fpsBox.textContent = 'FPS: ' + frames;
                    frames = 0;
                    lastTime = now;
                  }
                  win.requestAnimationFrame(updateFPS);
                }
                win.requestAnimationFrame(updateFPS);
              } catch (e) {
                console.warn("Could not inject FPS meter:", e);
              }
            };
          })
          .catch(err => {
            wrapper.innerHTML = '⚠️ Error loading games.json.<br><br>' + err.message;
            document.title = 'Loading error - HyperRush';
          });
      }
    }

    // Extra: Prevent iframe attempts to navigate top-level window (fallback)
    var _open = window.open;
    window.open = function(url, target, features) {
      if (target === '_top' || target === '_parent' || target === '_self') {
        console.warn('Blocked window.open targeting top/parent/self to prevent redirects.');
        return null;
      }
      return _open.call(window, url, target, features);
    };
  </script>
</body>
</html>
