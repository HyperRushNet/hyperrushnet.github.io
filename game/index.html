/*! hrn-blockredirects.min.js v1.0 */
(() => {
  window.hrn = window.hrn || {};
  window.hrn.notifications = window.hrn.notifications || { show: (msg, t = "info") => alert(msg) };

  let lastSrc = "";

  function monitorIframe(iframe) {
    lastSrc = iframe.src;
    iframe.addEventListener("load", () => {
      try {
        const cw = iframe.contentWindow;
        const loc = cw.location.href;
        if (loc !== lastSrc) {
          window.hrn.notifications.show("Redirect geblokkeerd in iframe", "warning");
          cw.location.href = lastSrc;
        }
      } catch (e) {
        // cross-origin, kan niet checken
      }
    });
  }

  const observer = new MutationObserver(muts => {
    for (const mut of muts) {
      for (const node of mut.addedNodes) {
        if (node.tagName === "IFRAME") {
          monitorIframe(node);
        }
      }
    }
  });

  observer.observe(document.body, { childList: true, subtree: true });

  window.hrn.blockRedirects = { monitorIframe };
})();

function getQueryParam(name) {
  const urlParams = new URLSearchParams(window.location.search);
  const val = urlParams.get(name);
  return val ? val : null;
}

window.addEventListener('DOMContentLoaded', () => {
  const nr = parseInt(getQueryParam("nr")) || 1;

  fetch("/json/games.json")
    .then(res => res.json())
    .then(games => {
      const game = games.find(g => g.number === nr);
      if (!game) {
        window.hrn.notifications.show("Game niet gevonden, fallback naar nr=1", "error");
        loadIframe(games[0].link);
        return;
      }
      loadIframe(game.link);
    })
    .catch(() => {
      window.hrn.notifications.show("Fout bij laden games.json", "error");
    });

  function loadIframe(url) {
    const iframe = document.createElement('iframe');
    iframe.src = url;
    document.body.appendChild(iframe);
    window.hrn.blockRedirects.monitorIframe(iframe);
  }
});
