<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading - HyperRushNet</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: inherit;
      z-index: 9999;
    }
    #loader div {
      width: 40px;
      height: 40px;
      border: 4px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #121212;
        color: #fff;
      }
    }
  </style>
</head>
<body>
  <div id="loader"><div></div></div>

  <script src="/assets/js/faviconchanger.min.js" defer></script>

  <script>
    let iframe;
    let games;

    const redirect = () => location.href = "/";

    const injectScriptsIntoIframe = () => {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow?.document;
        if (!doc || !doc.head) return;

        // Disable console logs inside iframe
        const disableLogs = doc.createElement("script");
        disableLogs.textContent = `
          console.log = console.debug = console.warn = console.error = () => {};
        `;
        doc.head.appendChild(disableLogs);

        // Cap FPS to ~60
        const capFPS = doc.createElement("script");
        capFPS.textContent = `
          let last = 0;
          function loop(t) {
            if (t - last > 16) {
              if (window.__updateGame) window.__updateGame();
              if (window.__renderGame) window.__renderGame();
              last = t;
            }
            requestAnimationFrame(loop);
          }
          requestAnimationFrame(loop);
        `;
        doc.head.appendChild(capFPS);

        // Pause/resume game on tab visibility change
        const pauseScript = doc.createElement("script");
        pauseScript.textContent = `
          document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
              if (window.__pauseGame) window.__pauseGame();
            } else {
              if (window.__resumeGame) window.__resumeGame();
            }
          });
        `;
        doc.head.appendChild(pauseScript);

        // Passive event listeners fix
        const passiveFix = doc.createElement("script");
        passiveFix.textContent = `
          ["touchstart","touchmove","wheel"].forEach(e => {
            window.addEventListener(e, () => {}, { passive: true });
          });
        `;
        doc.head.appendChild(passiveFix);

        // Notification script placeholder, with redirect blocker injection on load
        const notifyScript = doc.createElement("script");
        notifyScript.textContent = `/* Notification script code here */`;
        notifyScript.onload = () => {
          try {
            const blocker = doc.createElement("script");
            blocker.textContent = `
              /*! RedirectBlocker v1.1 | MIT */
              (() => {
                const notify = msg => window.hrn?.notifications?.show("Redirect blocked!", "info", "3000");
                const originalOpen = window.open;
                window.open = function(url, target, ...args) {
                  if (target && (target.includes("_top") || target.includes("_parent"))) {
                    notify("window.open → " + target);
                    return null;
                  }
                  return originalOpen.apply(this, [url, target, ...args]);
                };
                location.assign = function(url) { notify("location.assign"); };
                location.replace = function(url) { notify("location.replace"); };
                const defineLocation = (obj, name) => {
                  try {
                    const desc = Object.getOwnPropertyDescriptor(obj, "location");
                    if (!desc || desc.configurable) {
                      Object.defineProperty(obj, "location", {
                        configurable: true,
                        enumerable: true,
                        get: () => window.location,
                        set: val => { notify(name + ".location = " + val); }
                      });
                    }
                  } catch {}
                };
                defineLocation(window, "window");
                defineLocation(top, "top");
                defineLocation(parent, "parent");
                document.addEventListener("click", e => {
                  let el = e.target;
                  while (el && el !== document) {
                    if (el.tagName === "A" && el.href) {
                      notify("<a href>");
                      e.preventDefault();
                      break;
                    }
                    el = el.parentNode;
                  }
                }, true);
              })();
            `;
            doc.head.appendChild(blocker);
          } catch (err) {
            console.warn("Blocker inject failed", err);
          }
        };
        notifyScript.onerror = () => console.warn("Notification script failed to load");
        doc.head.appendChild(notifyScript);

      } catch (e) {
        console.warn("Iframe inject failed", e);
      }
    };

    const loadGame = async () => {
      const hashParts = location.hash.slice(1).split("/");
      const nr = parseInt(hashParts[1]);
      if (!nr || isNaN(nr)) return redirect();

      if (!games) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 5000);
          const res = await fetch("/assets/json/games.json", { signal: controller.signal });
          clearTimeout(timeout);
          if (!res.ok) throw new Error("Invalid response");
          games = await res.json();
        } catch (e) {
          console.error("Failed to load games.json:", e);
          return redirect();
        }
      }

      const game = games.find(g => g.number === nr);
      if (!game) return redirect();

      document.title = `${game.name} - HyperRush`;

      if (iframe) iframe.remove();

      iframe = document.createElement("iframe");
      iframe.src = game.link;
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
      iframe.onload = () => {
        injectScriptsIntoIframe();
        iframe.style.display = "block";
        document.getElementById("loader").style.display = "none";
      };
      iframe.onerror = () => redirect();

      document.body.appendChild(iframe);
    };

    window.addEventListener("hashchange", loadGame);
    loadGame();
  </script>
</body>
</html>
