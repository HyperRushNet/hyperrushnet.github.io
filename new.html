<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>HyperRushNet Game Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }

    #wrapper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      will-change: transform, opacity, filter;
      contain: strict;
      isolation: isolate;
    }

    iframe {
      width: 1280px;
      height: 720px;
      border: none;
      display: block;

      /* Rendering optimalisatie */
      filter: contrast(1.02) brightness(1.01);
      backface-visibility: hidden;
      will-change: transform, opacity;
      transform-origin: top left;
      image-rendering: pixelated;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="wrapper"></div>

  <script>
    const game = new URLSearchParams(location.search).get("game");
    const wrapper = document.getElementById("wrapper");

    if (!game) {
      wrapper.innerHTML = `
        <div style="color:white;font-family:sans-serif;text-align:center;padding:2rem">
          ⚠️ Geen game opgegeven.<br><br>
          Gebruik bijv.: <code>?game=polytrack</code>
        </div>`;
    } else {
      const iframe = document.createElement("iframe");
      iframe.src = `/hrn-${game}/`;
      iframe.sandbox = "allow-scripts allow-same-origin";
      iframe.allowFullscreen = true;
      iframe.loading = "eager";
      wrapper.appendChild(iframe);

      // Schaal 1x op basis van viewport tov 1280x720
      const targetWidth = 1280;
      const targetHeight = 720;
      const scaleX = window.innerWidth / targetWidth;
      const scaleY = window.innerHeight / targetHeight;
      const scale = Math.min(scaleX, scaleY);

      iframe.style.transform = `scale(${scale})`;

      // Eventueel fade bij framedrop (optioneel, lichtgewicht)
      let last = performance.now();
      function fadeLoop(now) {
        const delta = now - last;
        last = now;

        if (delta > 34) {
          iframe.style.opacity = "0.5";
          setTimeout(() => iframe.style.opacity = "1", 100);
        }

        requestAnimationFrame(fadeLoop);
      }
      requestAnimationFrame(fadeLoop);
    }
  </script>
</body>
</html>
