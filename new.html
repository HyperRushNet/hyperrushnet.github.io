<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>HyperRushNet Smooth Game Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="x-dns-prefetch-control" content="on" />
  <link rel="preconnect" href="https://hyperrushnet.github.io" crossorigin />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }

    #wrapper {
      position: fixed;
      inset: 0;
      will-change: transform, opacity, filter;
      contain: strict;
      perspective: 1px;
      isolation: isolate;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;

      /* Smooth rendering + blur glide */
      filter: blur(0.3px) contrast(1.02) brightness(1.01);
      backface-visibility: hidden;
      will-change: transform, opacity, filter;
      transform: translate3d(0, 0, 0);
      transition: opacity 33ms linear;
      contain: strict;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="wrapper"></div>

  <script>
    const game = new URLSearchParams(location.search).get("game");
    const wrapper = document.getElementById("wrapper");

    if (!game) {
      wrapper.innerHTML = `
        <div style="color:white;font-family:sans-serif;text-align:center;padding:2rem">
          ⚠️ Geen game opgegeven.<br><br>
          Gebruik bijv.: <code>?game=polytrack</code>
        </div>`;
    } else {
      const iframe = document.createElement("iframe");
      iframe.src = `/hrn-$(game)}/`;
      iframe.sandbox = "allow-scripts allow-same-origin";
      iframe.allowFullscreen = true;
      iframe.loading = "eager";
      wrapper.appendChild(iframe);

      // Soft fade on frame stall
      let last = performance.now();
      function fadeLoop(now) {
        const delta = now - last;
        last = now;
        if (delta > 100) {
          iframe.style.opacity = "0.7";
          requestAnimationFrame(() => iframe.style.opacity = "1");
        }
        requestAnimationFrame(fadeLoop);
      }
      requestAnimationFrame(fadeLoop);
    }
  </script>
</body>
</html>
