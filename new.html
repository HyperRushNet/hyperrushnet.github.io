<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>HyperRushNet Game Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="x-dns-prefetch-control" content="on">
  <link rel="preconnect" href="https://hyperrushnet.github.io" crossorigin>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search);
    const game = params.get('game');

    if (!game) {
      document.body.innerHTML = `
        <div style="color:white;font-family:sans-serif;padding:2rem;text-align:center">
          ⚠️ Geen game opgegeven.<br><br>
          Gebruik bijv.: <code>?game=polytrack</code>
        </div>`;
    } else {
      const iframe = document.createElement('iframe');
      iframe.src = \`/hrn-driving-games/\${encodeURIComponent(game)}/\`;
      iframe.sandbox = "allow-scripts allow-same-origin";
      iframe.allowFullscreen = true;
      iframe.loading = "eager";
      iframe.style.cssText = \`
        position:fixed;inset:0;border:0;
        width:100%;height:100%;
        display:block;
        backface-visibility:hidden;
        will-change:transform;
        transform:translateZ(0);
        contain:strict;
        image-rendering:pixelated;
      \`;
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
