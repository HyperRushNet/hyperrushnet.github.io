<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veilige iframe host</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <iframe
      id="theHeistFrame"
      src="https://hyperrushnet.github.io/hrn-driving-games/theheist/"
      sandbox="allow-scripts allow-same-origin"
    ></iframe>
  </div>

  <script>
    const iframe = document.getElementById('theHeistFrame');

    // Blokkeer pogingen om van frame te veranderen (bijv. via window.open, redirects, target="_top")
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        // Voor alle links in de iframe: verwijder target en overschrijf click
        const links = doc.querySelectorAll('a[href]');
        links.forEach(a => {
          a.removeAttribute('target');
          a.addEventListener('click', e => {
            e.preventDefault(); // Blokkeer navigatie
          });
        });

        // Monitor navigatie-events zoals meta-refresh, window.location in iframe
        const rewriteNavigation = () => {
          if (iframe.src !== 'https://hyperrushnet.github.io/hrn-driving-games/theheist/') {
            iframe.src = 'https://hyperrushnet.github.io/hrn-driving-games/theheist/';
          }
        };

        // Check elke 500ms of de src gewijzigd is
        setInterval(rewriteNavigation, 500);
      } catch (err) {
        console.warn('Kan inhoud niet inzien door cross-origin regels:', err);
        // fallback: alleen sandboxing gebruiken
      }
    });

    // Extra: blokkeer window.open-oproepen uit de iframe
    window.addEventListener('message', event => {
      // optioneel: behandel berichten alleen van vertrouwde origin
      // stuur geen nieuwe venster activering door
    });
  </script>
</body>
</html>
