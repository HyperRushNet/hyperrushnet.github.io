<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>HyperRushNet Game Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="x-dns-prefetch-control" content="on" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }

    #wrapper {
      position: absolute;
      top: 0; left: 0;
      right: 0; bottom: 0;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;

      /* Visueel smooth: oudere browsers ondersteunen dit */
      filter: progid:DXImageTransform.Microsoft.BasicImage(opacity=1); /* IE fallback */
      -ms-filter: "progid:DXImageTransform.Microsoft.BasicImage(opacity=1)";
      -webkit-filter: blur(0.2px);
      filter: blur(0.2px);

      -webkit-transform: translateZ(0);
      transform: translateZ(0);

      /* Simpele overgang */
      -webkit-transition: opacity 0.1s linear, transform 0.1s ease-in-out;
      transition: opacity 0.1s linear, transform 0.1s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="wrapper"></div>

  <script>
    // Basic polyfill voor IE9+ support
    (function() {
      if (!window.requestAnimationFrame) {
        window.requestAnimationFrame = function(callback) {
          return setTimeout(callback, 16);
        };
      }
      if (!window.performance) {
        window.performance = {};
      }
      if (!performance.now) {
        performance.now = function() {
          return new Date().getTime();
        };
      }
    })();

    function getQueryParam(name) {
      var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
      return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
    }

    var game = getQueryParam("game");
    var wrapper = document.getElementById("wrapper");

    if (!game) {
      wrapper.innerHTML = (
        '<div style="color:white;font-family:sans-serif;text-align:center;padding:2rem">' +
        '⚠️ Geen game opgegeven.<br><br>' +
        'Gebruik bijv.: <code>?game=polytrack</code>' +
        '</div>'
      );
    } else {
      var iframe = document.createElement("iframe");
      iframe.src = "/hrn-" + game + "/";
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
      iframe.setAttribute("allowfullscreen", "true");
      iframe.setAttribute("loading", "eager");
      wrapper.appendChild(iframe);

      // Simuleer lichte pulse bij frame-hapering
      var last = performance.now();
      function fadeLoop(now) {
        var delta = now - last;
        last = now;
        if (delta > 100) {
          // Check of transform ondersteund is
          if ("transform" in iframe.style || "webkitTransform" in iframe.style) {
            iframe.style.transform = "scale(0.998)";
            requestAnimationFrame(function() {
              iframe.style.transform = "scale(1)";
            });
          } else {
            iframe.style.opacity = "0.98";
            requestAnimationFrame(function() {
              iframe.style.opacity = "1";
            });
          }
        }
        requestAnimationFrame(fadeLoop);
      }
      requestAnimationFrame(fadeLoop);
    }
  </script>
</body>
</html>
