<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>10 Minutes Till Dawn - Mobile Fix</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }

    #touch-controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 9999;
      pointer-events: none;
    }

    #touch-controls > * {
      pointer-events: auto;
    }

    #dpad, #actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #dpad div {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      font-size: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.3);
      border: none;
      color: black;
      font-weight: bold;
    }

    @media (min-width: 769px) {
      #touch-controls {
        display: none;
      }
    }
  </style>
</head>
<body>

<iframe id="game-frame" src="https://hyperrushnet.github.io/hrn-action-games/10-minutes-till-dawn/" allowfullscreen></iframe>

<div id="touch-controls">
  <div id="dpad">
    <button data-key="ArrowUp">▲</button>
    <div>
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowDown">▼</button>
      <button data-key="ArrowRight">▶</button>
    </div>
  </div>
  <div id="actions">
    <button data-key=" ">␣</button>
    <button id="shoot-btn">🔫</button>
  </div>
</div>

<script>
  const iframe = document.getElementById("game-frame");

  function getGameCanvas() {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      return doc.querySelector('canvas');
    } catch {
      return null;
    }
  }

  function sendKey(key, type = 'keydown') {
    const event = new KeyboardEvent(type, {
      key: key,
      code: key,
      bubbles: true
    });
    iframe.contentWindow.dispatchEvent(event);
  }

  function sendMouse(type) {
    const canvas = getGameCanvas();
    if (!canvas) return;

    const rect = canvas.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;

    const event = new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      clientX: x,
      clientY: y,
      button: 0
    });

    canvas.dispatchEvent(event);
  }

  // Knoppen: toets-events
  document.querySelectorAll('button[data-key]').forEach(btn => {
    const key = btn.getAttribute('data-key');
    btn.addEventListener('touchstart', e => {
      if (e.cancelable) e.preventDefault();
      sendKey(key, 'keydown');
    });
    btn.addEventListener('touchend', e => {
      if (e.cancelable) e.preventDefault();
      sendKey(key, 'keyup');
    });
  });

  // Schietknop: muis-events
  const shootBtn = document.getElementById('shoot-btn');
  shootBtn.addEventListener('touchstart', e => {
    if (e.cancelable) e.preventDefault();
    sendMouse('mousedown');
  });
  shootBtn.addEventListener('touchend', e => {
    if (e.cancelable) e.preventDefault();
    sendMouse('mouseup');
    sendMouse('click');
  });

  // Voor desktop testing
  shootBtn.addEventListener('mousedown', e => {
    e.preventDefault();
    sendMouse('mousedown');
  });
  shootBtn.addEventListener('mouseup', e => {
    e.preventDefault();
    sendMouse('mouseup');
    sendMouse('click');
  });
</script>

</body>
</html>
