<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>HyperRushNet Game Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="x-dns-prefetch-control" content="on" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }

    #wrapper {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
    }

    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;

      /* Performant rendering */
      transform: translateZ(0);
      backface-visibility: hidden;

      /* GEEN blur, filters of overgangen = maximale snelheid */
      transition: none;
    }
  </style>
</head>
<body>
  <div id="wrapper"></div>

  <script>
    // Compatibele polyfills
    (function() {
      if (!window.requestAnimationFrame) {
        window.requestAnimationFrame = function(cb) { return setTimeout(cb, 16); };
      }
      if (!window.performance) window.performance = {};
      if (!performance.now) {
        performance.now = function() { return new Date().getTime(); };
      }
    })();

    // Haal game-parameter uit URL
    function getQueryParam(name) {
      var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
      return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
    }

    var game = getQueryParam("game");
    var wrapper = document.getElementById("wrapper");

    if (!game) {
      wrapper.innerHTML = (
        '<div style="color:white;font-family:sans-serif;text-align:center;padding:2rem">' +
        '⚠️ Geen game opgegeven.<br><br>' +
        'Gebruik bijv.: <code>?game=polytrack</code>' +
        '</div>'
      );
    } else {
      var iframe = document.createElement("iframe");
      iframe.src = "/hrn-" + game + "/";
      iframe.setAttribute("allowfullscreen", "true");
      iframe.setAttribute("loading", "eager");

      // LET OP: sandbox is weggelaten voor betere performance
      // Voeg eventueel terug toe: iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");

      wrapper.appendChild(iframe);

      // Zeer lichte fallback-check op performance drops (1x per seconde)
      var last = performance.now();
      setInterval(function () {
        var now = performance.now();
        var delta = now - last;
        last = now;
        if (delta > 100) {
          // minimale visuele reset (optioneel)
          iframe.style.opacity = "0.98";
          setTimeout(function () {
            iframe.style.opacity = "1";
          }, 50);
        }
      }, 1000); // slechts elke seconde check
    }
  </script>
</body>
</html>
