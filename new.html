<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>HyperRushNet Game Loader - Downscaled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Wrapper die full screen is, maar met transform schaal */
    #iframe-wrapper {
      width: 640px;       /* lagere render resolutie */
      height: 360px;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(2);  /* schaal 2x */
      transform-origin: top left;
      overflow: hidden;
      background: #000;
      /* evt border toevoegen om schaal effect zichtbaar te maken:
      border: 2px solid red; 
      */
    }

    iframe {
      width: 640px;       /* zelfde als wrapper */
      height: 360px;
      border: none;
      display: block;
      /* geen extra filters of transitions */
    }

  </style>
</head>
<body>
  <div id="iframe-wrapper"></div>

  <script>
    function getQueryParam(name) {
      var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
      return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
    }

    var game = getQueryParam("game");
    var wrapper = document.getElementById("iframe-wrapper");

    if (!game) {
      wrapper.innerHTML =
        '<div style="color:white;font-family:sans-serif;text-align:center;padding:2rem">' +
        '⚠️ Geen game opgegeven.<br><br>' +
        'Gebruik bijv.: <code>?game=polytrack</code>' +
        '</div>';
    } else {
      var iframe = document.createElement("iframe");
      iframe.src = "/hrn-" + game + "/";
      iframe.allowFullscreen = true;
      iframe.loading = "eager";
      wrapper.appendChild(iframe);
    }
  </script>
</body>
</html>
