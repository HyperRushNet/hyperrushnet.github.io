<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Iframe Redirect Blocker zonder reset</title>
  <style>
    iframe { width: 600px; height: 400px; border: 1px solid black; }
  </style>
</head>
<body>

<h2>Parent pagina</h2>
<iframe id="myIframe" src="/action-games/bacon-may-die"></iframe>

<script>
(function(){
  const iframe = document.getElementById("myIframe");
  let lastUrl = null;
  let locked = false;

  iframe.onload = () => {
    try {
      lastUrl = iframe.contentWindow.location.href;
    } catch (e) {}
  };

  setInterval(() => {
    if (locked) return;
    try {
      const currentUrl = iframe.contentWindow.location.href;
      if (lastUrl && currentUrl !== lastUrl) {
        // Redirect gedetecteerd
        locked = true;
        alert("Redirect binnen iframe is geblokkeerd!");
        iframe.contentWindow.history.back(); // Terug naar vorige pagina (geen reset)
        setTimeout(() => {
          // Geef tijd om terug te gaan, dan update lastUrl
          lastUrl = iframe.contentWindow.location.href;
          locked = false;
        }, 500);
      } else {
        lastUrl = currentUrl;
      }
    } catch (e) {
      // Cross-origin? Dan kunnen we niks doen
    }
  }, 200); // check elke 200ms
})();
</script>

</body>
</html>
