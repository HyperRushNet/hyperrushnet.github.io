<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100vw;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 20px;
      position: relative;
      background: linear-gradient(135deg, #0a0f3d, #3046d6, #0b2248);
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    .message h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .message p {
      font-size: 16px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>You are offline</h1>
    <p>Your internet connection is down.</p>
    <p>Please check it and try again.</p>
  </div>
</body>
</html>
