<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decide</title>
<script>
    // SW registreren, niet wachten
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/app/mobile/samsung/service-worker.js')
            .catch(e => console.warn('SW registratie faalde', e));
    }

    // Direct redirect
    const go = navigator.onLine
        ? '/app/mobile/samsung/splash.html'
        : '/app/mobile/samsung/offline.html';

    window.location.replace(go);
</script>
</head>
<body>
<p>Controleer internetverbinding...</p>
</body>
</html>
