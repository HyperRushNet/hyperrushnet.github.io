<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Games</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="main-frame"></iframe>

  <script>
    const iframe = document.getElementById('main-frame');

    fetch('/internet-test.txt', { method: 'GET', cache: 'no-store' })
      .then(response => {
        if (response.ok) {
          window.location.href = '/';
        } else {
          iframe.src = '/app/offline.html';
        }
      })
      .catch(() => {
        iframe.src = '/app/offline.html';
      });
  </script>
</body>
</html>
