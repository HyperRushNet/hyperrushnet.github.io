<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herwerkte Overlay + Sidebar</title>
  <style>
    /* 🔁 CSS RESET (modern) */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
    }
    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow-x: hidden;
    }

    :root {
      --sidebar-width: 240px;
    }

    body.lock-scroll {
      overflow: hidden;
    }

    /* 🔷 Sidebar */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: #1b1b2f;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1001;
      padding: 1rem;
      overflow-y: auto;
    }

    #sidebar.open {
      transform: translateX(0);
    }

    /* 🔷 Overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    #overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 🔷 Toggle knop */
    #menuToggle {
      position: fixed;
      top: 1rem;
      left: 1rem;
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.5rem;
      border-radius: 8px;
      z-index: 1002;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      #menuToggle {
        display: none;
      }
      #sidebar {
        transform: translateX(0);
      }
      #overlay {
        display: none;
      }
    }

    /* 🔷 Content */
    #content {
      padding: 2rem;
    }

    .line {
      margin: 1rem 0;
      padding: 1rem;
      background: #222;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>Menu</h2>
    <ul>
      <li><a href="#" style="color:white">Home</a></li>
      <li><a href="#" style="color:white">Over</a></li>
      <li><a href="#" style="color:white">Contact</a></li>
    </ul>
  </div>

  <div id="overlay"></div>
  <div id="menuToggle">&#9776;</div>

  <div id="content">
    <h1>Inhoud</h1>
    <p>Scroll naar beneden om te testen.</p>
    <div id="scroller">
      <!-- JS voegt hier 100 regels toe -->
    </div>
  </div>

  <script>
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const toggle = document.getElementById("menuToggle");

    toggle.addEventListener("click", () => {
      const open = sidebar.classList.toggle("open");
      overlay.classList.toggle("active", open);
      document.body.classList.toggle("lock-scroll", open);
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
      document.body.classList.remove("lock-scroll");
    });

    // Extra fix: als schermhoogte verandert → overlay forceren
    window.addEventListener("resize", () => {
      if (overlay.classList.contains("active")) {
        overlay.style.display = "none";
        // force reflow
        void overlay.offsetWidth;
        overlay.style.display = "";
      }
    });

    // Scroll-inhoud genereren
    const scroller = document.getElementById("scroller");
    for (let i = 1; i <= 100; i++) {
      const div = document.createElement("div");
      div.className = "line";
      div.textContent = `Regel ${i}`;
      scroller.appendChild(div);
    }
  </script>
</body>
</html>
