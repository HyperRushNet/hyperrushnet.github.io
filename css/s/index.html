<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snelle Overlay Fix</title>
  <style>
    /* 🔁 CSS RESET */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
    }
    html, body {
      height: 100%;
      font-family: sans-serif;
      background: #111;
      color: white;
      overflow-x: hidden;
    }

    body.lock-scroll {
      overflow: hidden;
    }

    :root {
      --sidebar-width: 240px;
    }

    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: #222;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1001;
      padding: 1rem;
      overflow-y: auto;
    }

    #sidebar.open {
      transform: translateX(0);
    }

    #overlay {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1000;
    }

    #overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #menuToggle {
      position: fixed;
      top: 1rem;
      left: 1rem;
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.5rem;
      border-radius: 8px;
      z-index: 1002;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      #menuToggle {
        display: none;
      }
      #sidebar {
        transform: translateX(0);
      }
      #overlay {
        display: none !important;
      }
    }

    #content {
      padding: 2rem;
    }

    .line {
      background: #333;
      margin: 1rem 0;
      padding: 1rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>Menu</h2>
    <ul>
      <li><a href="#" style="color:white">Home</a></li>
      <li><a href="#" style="color:white">Games</a></li>
      <li><a href="#" style="color:white">Contact</a></li>
    </ul>
  </div>

  <div id="overlay"></div>
  <div id="menuToggle">&#9776;</div>

  <div id="content">
    <h1>Testpagina</h1>
    <p>Met scrollbare inhoud + instant overlay fix bij schermveranderingen.</p>
    <div id="scroller"></div>
  </div>

  <script>
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const toggle = document.getElementById("menuToggle");

    toggle.addEventListener("click", () => {
      const open = sidebar.classList.toggle("open");
      overlay.classList.toggle("active", open);
      document.body.classList.toggle("lock-scroll", open);
      if (open) updateOverlaySize();
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
      document.body.classList.remove("lock-scroll");
    });

    function updateOverlaySize() {
      overlay.style.width = `${window.innerWidth}px`;
      overlay.style.height = `${window.innerHeight}px`;
    }

    // update overlay size on every frame during resize
    let resizeWatching = false;
    window.addEventListener("resize", () => {
      if (!resizeWatching) {
        resizeWatching = true;
        requestAnimationFrame(() => {
          updateOverlaySize();
          resizeWatching = false;
        });
      }
    });

    // init size (in case menu is open on load)
    updateOverlaySize();

    // voeg 100 regels toe om scrollen te testen
    const scroller = document.getElementById("scroller");
    for (let i = 1; i <= 100; i++) {
      const div = document.createElement("div");
      div.className = "line";
      div.textContent = `Regel ${i}`;
      scroller.appendChild(div);
    }
  </script>
</body>
</html>
