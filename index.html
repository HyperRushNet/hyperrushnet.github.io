<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Wrapper (Max FPS)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    #game-container {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;

      /* FPS boost */
      backface-visibility: hidden;
      will-change: transform;
      transform: translateZ(0);
      contain: strict;
      image-rendering: pixelated;
    }

    #fallbackMessage {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background-color: rgba(0,0,0,0.85);
      color: white;
      font-family: sans-serif;
      font-size: 1rem;
      text-align: center;
      padding: 2rem;
      z-index: 99;
    }

    #fallbackMessage button {
      margin-top: 1rem;
      font-size: 1rem;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <iframe
      id="gameIframe"
      sandbox="allow-scripts allow-same-origin"
      allowfullscreen
      loading="eager"
      decoding="async"
    ></iframe>
    <div id="fallbackMessage">
      Deze game probeerde buiten de sandbox te navigeren of werd geblokkeerd.<br><br>
      <button onclick="location.reload()">Herlaad de game</button>
    </div>
  </div>

  <script>
    const iframe = document.getElementById("gameIframe");
    const fallback = document.getElementById("fallbackMessage");

    const urlParams = new URLSearchParams(location.search);
    const game = urlParams.get("game");

    if (!game) {
      fallback.innerHTML = "⚠️ Geen game opgegeven.<br><br>Gebruik bijv.: <code>?game=theheist</code>";
      fallback.style.display = "flex";
    } else {
      iframe.src = `/hrn-driving-games/${game}`;
    }

    // Blokkeer redirect- of breakout-pogingen
    iframe.addEventListener("load", () => {
      const checkEscape = setInterval(() => {
        try {
          const current = iframe.contentWindow.location.href;
          if (!current.includes(game)) {
            throw new Error("Escape attempt");
          }
        } catch {
          fallback.style.display = "flex";
          iframe.style.display = "none";
          clearInterval(checkEscape);
        }
      }, 500);
    });
  </script>
</body>
</html>
