  <script>
(function(){
  const lastShown = localStorage.getItem('toastShownDate');
  const today = new Date().toISOString().split('T')[0];
  if(lastShown === today) return;
  localStorage.setItem('toastShownDate', today);

  const linkCSS = document.createElement('link');
  linkCSS.rel = 'stylesheet';
  linkCSS.href = 'https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css';
  document.head.appendChild(linkCSS);

  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js';
  script.onload = ()=>{
    const style = document.createElement('style');
    style.innerHTML = ".notyf__message a{color:#0af;text-decoration:none;font-weight:600;padding:4px 6px;border-radius:4px;background:rgba(255,255,255,0.1);display:inline-block;cursor:pointer;}";
    document.head.appendChild(style);

    const notyf = new Notyf({
      duration: 15000,
      position:{x:'right',y:'bottom'},
      types:[{type:'info',background:'#111',icon:false,ripple:true}]
    });

    notyf.open({
      type:'info',
      message:'Test site live: 500+ games! Devices not sorted yet, no images—but <a href="https://un-zynq.github.io" target="_blank">check it out!</a>'
    });
  };
  document.body.appendChild(script);
})();</script>
