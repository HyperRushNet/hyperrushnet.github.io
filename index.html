<!DOCTYPE html> 
<html lang="nl"> 
<head>
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"> 
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>The HyperRush Network | Free Online Games</title>
  <link rel="icon" href="/assets/images/icons/light.png" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/css/dark.css" />
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/hrn-notifications.min.js" defer></script>
  <script src="/assets/js/notranslate.min.js"></script>
  <script src="/assets/js/domainblock.min.js"></script>
  <style>
    #searchBtn img {
      width: 24px;
      height: 24px;
      filter: invert(69%) sepia(96%) saturate(409%) hue-rotate(180deg) brightness(103%) contrast(90%);
    }
  </style>
</head>
<body>
  <div id="appWrapper">
    <button id="menuToggle" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" aria-hidden="true" focusable="false">
        <path d="M4 6h16M4 12h16M4 18h16" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div id="sidebar" aria-label="Sidebar">
      <div id="searchWrapper">
        <input id="searchInput" type="text" placeholder="Zoek spel..." aria-label="Zoek spel" />
        <button id="searchBtn" aria-label="Zoek">
          <img src="/assets/images/svg/search.png" alt="Zoek" />
        </button>
      </div>
      <nav id="categoryList" aria-label="Categorieën"></nav>
    </div>

    <main id="content" role="main">
      <div id="gameCardsContainer" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>
