<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tabs with iframe & loader</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
  html,body{height:100%;background:#121212;color:#eee;display:flex;overflow:hidden;}
  #sidebar{width:260px;background:#1f1f1f;display:flex;flex-direction:column;overflow-y:auto;padding:20px 0;box-shadow:2px 0 8px #000;}
  #sidebar.collapsed{width:70px;}
  #sidebar button{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 24px;color:#ccc;border-left:4px solid transparent;margin-bottom:6px;transition:0.12s;}
  #sidebar button i{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:1.3rem;width:26px;text-align:center;user-select:none;}
  #sidebar button span{white-space:nowrap;user-select:none;transition:opacity 0.15s;}
  #sidebar.collapsed button span{opacity:0;pointer-events:none;}
  #sidebar button:hover:not(.active){background:#2a2a2a;color:#fff;}
  #sidebar button.active{color:#0af;border-left-color:#0af;background:#151515;font-weight:600;}
  #sidebar button:focus{outline:none;box-shadow:none;}
  #content{flex-grow:1;position:relative;background:#181818;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  iframe{width:100%;height:100vh;border:none;display:none;}
  iframe.active{display:block;}
  #spinner{position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border:5px solid #444;border-top-color:#0af;border-radius:50%;animation:spin 1s linear infinite;display:none;z-index:10;}
  #toggleSidebarBtn{margin-top:auto;border-top:1px solid #333;padding:14px;color:#777;cursor:pointer;transition:color 0.12s;}
  #toggleSidebarBtn:hover{color:#0af;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
  <aside id="sidebar" aria-label="Navigation">
    <button class="active" onclick="showTab('profile', this)" aria-selected="true" data-src="profile.html"><i class="material-symbols-outlined">person</i><span>Profile</span></button>
    <button onclick="showTab('privacy', this)" aria-selected="false" data-src="privacy.html"><i class="material-symbols-outlined">lock</i><span>Privacy</span></button>
    <button onclick="showTab('language', this)" aria-selected="false" data-src="language.html"><i class="material-symbols-outlined">language</i><span>Language</span></button>
    <button onclick="showTab('system', this)" aria-selected="false" data-src="system.html"><i class="material-symbols-outlined">computer</i><span>System</span></button>
    <button onclick="showTab('about', this)" aria-selected="false" data-src="about.html"><i class="material-symbols-outlined">info</i><span>About</span></button>
    <button id="toggleSidebarBtn" onclick="toggleSidebar()" aria-label="Toggle sidebar"><i class="material-symbols-outlined">keyboard_double_arrow_left</i><span>Collapse</span></button>
  </aside>

  <main id="content" role="tabpanel">
    <div id="spinner"></div>
    <iframe id="iframe-profile" src="profile.html" class="active" title="Profile"></iframe>
    <iframe id="iframe-privacy" title="Privacy"></iframe>
    <iframe id="iframe-language" title="Language"></iframe>
    <iframe id="iframe-system" title="System"></iframe>
    <iframe id="iframe-about" title="About"></iframe>
  </main>

<script>
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleSidebarBtn');
  const buttons = sidebar.querySelectorAll('button:not(#toggleSidebarBtn)');
  const iframes = {
    profile: document.getElementById('iframe-profile'),
    privacy: document.getElementById('iframe-privacy'),
    language: document.getElementById('iframe-language'),
    system: document.getElementById('iframe-system'),
    about: document.getElementById('iframe-about'),
  };
  const spinner = document.getElementById('spinner');

  function showTab(id, btn){
    buttons.forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false');});
    btn.classList.add('active');
    btn.setAttribute('aria-selected','true');
    Object.values(iframes).forEach(f=>f.classList.remove('active'));
    const iframe=iframes[id];
    if(!iframe.src){
      spinner.style.display='block';
      iframe.src=btn.getAttribute('data-src');
      iframe.onload=()=>{spinner.style.display='none';iframe.classList.add('active');};
    } else {
      spinner.style.display='none';
      iframe.classList.add('active');
    }
  }

  function toggleSidebar(){
    sidebar.classList.toggle('collapsed');
    const collapsed=sidebar.classList.contains('collapsed');
    toggleBtn.querySelector('span').textContent=collapsed?'Expand':'Collapse';
    toggleBtn.querySelector('i').textContent=collapsed?'keyboard_double_arrow_right':'keyboard_double_arrow_left';
  }
</script>
</body>
</html>
