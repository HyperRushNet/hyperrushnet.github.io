<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tabs met een enkele iframe</title>
<style>
  * {margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
  html,body {height:100%;background:#121212;color:#eee;display:flex;overflow:hidden;}

  #sidebar {
    width:260px;
    background:#1f1f1f;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    padding:20px 0;
    box-shadow:2px 0 8px #000;
    /* De transition voor de zijbalk is cruciaal voor de synchronisatie */
    transition: width 0.3s;
  }
  #sidebar.collapsed {width:70px;}

  #sidebar button {
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 24px;
    color:#ccc;
    border-left:4px solid transparent;
    margin-bottom:6px;
    transition:0.12s;
  }
  #sidebar button i {
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    font-size:1.3rem;
    width:26px;
    text-align:center;
    user-select:none;
  }
  #sidebar button span {
    white-space:nowrap;
    user-select:none;
    transition:opacity 0.15s;
  }
  #sidebar.collapsed button span {opacity:0;pointer-events:none;}
  #sidebar button:hover:not(.active){background:#2a2a2a;color:#fff;}
  #sidebar button.active{color:#0af;border-left-color:#0af;background:#151515;font-weight:600;}
  #sidebar button:focus{outline:none;box-shadow:none;}

  #content {
    flex-grow:1;
    background:#181818;
    overflow:hidden;
    position: relative;
    width: calc(100vw - 260px);
    /* De transition voor de content is ook essentieel */
    transition: width 0.3s;
  }

  #content.collapsed-sidebar {
    width: calc(100vw - 70px);
  }

  #content iframe {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
    transition: opacity 0.3s ease-in-out;
  }
  
  #toggleSidebarBtn {
    margin-top:auto;
    border-top:1px solid #333;
    padding:14px;
    color:#777;
    cursor:pointer;
    transition:color 0.12s;
  }
  #toggleSidebarBtn:hover{color:#0af;}

  @keyframes spin{to{transform:rotate(360deg);}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
  <aside id="sidebar" aria-label="Navigation">
    <button class="active" onclick="showTab(this)" aria-selected="true" data-src="https://example.com"><i class="material-symbols-outlined">person</i><span>Profile</span></button>
    <button onclick="showTab(this)" aria-selected="false" data-src="https://example.com"><i class="material-symbols-outlined">lock</i><span>Privacy</span></button>
    <button onclick="showTab(this)" aria-selected="false" data-src="https://example.com"><i class="material-symbols-outlined">language</i><span>Language</span></button>
    <button onclick="showTab(this)" aria-selected="false" data-src="https://example.com"><i class="material-symbols-outlined">computer</i><span>System</span></button>
    <button onclick="showTab(this)" aria-selected="false" data-src="https://example.com"><i class="material-symbols-outlined">info</i><span>About</span></button>
    <button id="toggleSidebarBtn" onclick="toggleSidebar()" aria-label="Toggle sidebar"><i class="material-symbols-outlined">keyboard_double_arrow_left</i><span>Collapse</span></button>
  </aside>

  <main id="content" role="tabpanel">
    <iframe id="main-iframe" src="https://example.com" title="Main Content"></iframe>
  </main>

<script>
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('content');
  const toggleBtn = document.getElementById('toggleSidebarBtn');
  const buttons = sidebar.querySelectorAll('button:not(#toggleSidebarBtn)');
  const mainIframe = document.getElementById('main-iframe');

  function showTab(btn){
    buttons.forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');

    // Fade-out van de iframe
    mainIframe.style.opacity = '0';
    
    // Na een korte vertraging, laden we de nieuwe URL
    setTimeout(() => {
      mainIframe.src = btn.dataset.src;
    }, 300);
  }

  // Fade-in zodra de nieuwe pagina is geladen
  mainIframe.onload = () => {
    mainIframe.style.opacity = '1';
  };

  function toggleSidebar(){
    sidebar.classList.toggle('collapsed');
    content.classList.toggle('collapsed-sidebar');
    const collapsed = sidebar.classList.contains('collapsed');
    const icon = toggleBtn.querySelector('i');
    const text = toggleBtn.querySelector('span');

    icon.textContent = collapsed ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left';
    text.textContent = collapsed ? 'Expand' : 'Collapse';
  }
</script>
</body>
</html>
