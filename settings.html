<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Instellingen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #1e1e1e;
      color: #fff;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    #sidebar {
      flex-shrink: 0;
      width: 280px;
      min-width: 60px;
      background: #2d2d2d;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }

    #sidebar.collapsed {
      width: 60px;
    }

    #sidebar button {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: 0.2s;
    }

    #sidebar button i {
      width: 20px;
      text-align: center;
      font-style: normal;
    }

    #sidebar button span {
      transition: 0.3s;
    }

    #sidebar.collapsed button span {
      display: none;
    }

    #sidebar button:hover {
      background: #3a3a3a;
    }

    #sidebar button.active {
      background: #0078d7;
    }

    #content {
      flex-grow: 1;
      flex-shrink: 1;
      flex-basis: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .content-inner {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    h1 {
      font-size: clamp(1.5rem, 2vw, 2.5rem);
      margin-bottom: 10px;
    }

    .setting {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting label {
      font-weight: bold;
      font-size: clamp(0.9rem, 1vw, 1.1rem);
    }

    .setting input,
    .setting select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background: #3a3a3a;
      color: #fff;
    }

    /* Mobile sidebar altijd ingeklapt */
    @media (max-width: 768px) {
      #sidebar {
        width: 60px !important;
      }

      #sidebar button span {
        display: none;
      }

      #toggleSidebarBtn {
        display: none !important;
      }

      #content {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <button class="active" onclick="showPanel('profiel', this)"><i>👤</i><span>Profiel</span></button>
    <button onclick="showPanel('privacy', this)"><i>🔒</i><span>Privacy</span></button>
    <button onclick="showPanel('taal', this)"><i>🌐</i><span>Taal</span></button>
    <button onclick="showPanel('systeem', this)"><i>💻</i><span>Systeem</span></button>
    <button onclick="showPanel('over', this)"><i>ℹ️</i><span>Over</span></button>
    <button id="toggleSidebarBtn" onclick="toggleSidebar()"><i>🡸</i><span>Sidebar inklappen</span></button>
  </aside>

  <main id="content">
    <div class="content-inner">
      <section id="profiel" class="panel">
        <h1>Profiel</h1>
        <div class="setting">
          <label>Gebruikersnaam</label>
          <input type="text" placeholder="Jouw naam...">
        </div>
        <div class="setting">
          <label>Email</label>
          <input type="email" placeholder="voorbeeld@mail.com">
        </div>
      </section>

      <section id="privacy" class="panel" style="display:none">
        <h1>Privacy</h1>
        <div class="setting">
          <label>Trackingbescherming</label>
          <select>
            <option>Basis</option>
            <option>Gebalanceerd</option>
            <option>Strikt</option>
          </select>
        </div>
        <div class="setting">
          <label>Wachtwoorden opslaan</label>
          <select>
            <option>Ja</option>
            <option>Nee</option>
          </select>
        </div>
      </section>

      <section id="taal" class="panel" style="display:none">
        <h1>Taal</h1>
        <div class="setting">
          <label>Voorkeurstaal</label>
          <select>
            <option>Nederlands</option>
            <option>Engels</option>
            <option>Duits</option>
          </select>
        </div>
      </section>

      <section id="systeem" class="panel" style="display:none">
        <h1>Systeem</h1>
        <div class="setting">
          <label>Versnelling door hardware</label>
          <select>
            <option>Ingeschakeld</option>
            <option>Uitgeschakeld</option>
          </select>
        </div>
      </section>

      <section id="over" class="panel" style="display:none">
        <h1>Over deze app</h1>
        <p style="font-size:clamp(1rem,1.5vw,1.2rem);line-height:1.6;">
          Versie: 1.0.0<br>
          Gemaakt door: Jouw Team<br>
          Deze instellingenpagina is volledig responsive, clean en future-proof.
        </p>
      </section>
    </div>
  </main>

  <script>
    function showPanel(id, btn) {
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none')
      document.getElementById(id).style.display = 'block'
      document.querySelectorAll('#sidebar button').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar')
      sidebar.classList.toggle('collapsed')
    }
  </script>
</body>
</html>
