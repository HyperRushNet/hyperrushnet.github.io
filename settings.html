<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabs met een enkele iframe</title>
    <style>
        /* Algemene stijlen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        html, body {
            height: 100%;
            background: #121212;
            color: #eee;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar stijlen */
        #sidebar {
            width: 260px;
            background: #1f1f1f;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px 0;
            box-shadow: 2px 0 8px #000;
            transition: width 0.3s ease-in-out;
        }

        #sidebar.collapsed {
            width: 70px;
            overflow-x: hidden;
        }

        #sidebar button {
            all: unset;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            color: #ccc;
            border-left: 4px solid transparent;
            margin-bottom: 6px;
            transition: 0.2s ease-in-out;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
        }

        #sidebar.collapsed button {
            padding: 14px 0;
            justify-content: center;
            gap: 0;
        }

        #sidebar button i {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 1.3rem;
            width: 26px;
            text-align: center;
            user-select: none;
        }
        
        #sidebar.collapsed button i {
            width: 100%;
        }

        #sidebar button span {
            white-space: nowrap;
            user-select: none;
            transition: opacity 0.2s ease-in-out;
        }

        #sidebar.collapsed button span {
            opacity: 0;
            pointer-events: none;
            width: 0;
        }

        #sidebar button:hover:not(.active) {
            background: #2a2a2a;
            color: #fff;
        }

        #sidebar button.active {
            color: #0af;
            border-left-color: #0af;
            background: #151515;
            font-weight: 600;
        }

        #sidebar button:focus {
            outline: none;
            box-shadow: none;
        }

        /* Content stijlen */
        #content {
            flex-grow: 1;
            background: #181818;
            overflow: hidden;
            position: relative;
            width: calc(100vw - 260px);
            transition: width 0.3s ease-in-out;
        }

        #content.collapsed-sidebar {
            width: calc(100vw - 70px);
        }

        #content iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
        }

        /* Sidebar toggle knop */
        #toggleSidebarBtn {
            margin-top: auto;
            border-top: 1px solid #333;
            padding: 14px;
            color: #777;
            cursor: pointer;
            transition: color 0.12s;
            display: flex;
        }

        #toggleSidebarBtn:hover {
            color: #0af;
        }

        #sidebar.collapsed #toggleSidebarBtn {
            padding: 14px 0;
            justify-content: center;
        }

        #sidebar.collapsed #toggleSidebarBtn span {
            width: 0;
        }
        
        /* Media query voor kleine schermen */
        @media (max-width: 768px) {
            #sidebar {
                width: 70px;
            }
            #sidebar.collapsed {
                width: 70px;
            }
            #sidebar button span {
                opacity: 0;
                pointer-events: none;
                width: 0;
            }
            #content {
                width: calc(100vw - 70px);
            }
            #content.collapsed-sidebar {
                width: calc(100vw - 70px);
            }
            #toggleSidebarBtn {
                display: none !important;
            }
        }
        
        /* LAADANIMATIE STIJLEN */
        #loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease-in-out, visibility 0.3s;
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }

        #loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <aside id="sidebar" aria-label="Navigation">
        <button class="active" onclick="showTab(this)" aria-selected="true" data-src="https://example.com"><i class="material-symbols-outlined">person</i><span>Profile</span></button>
        <button onclick="showTab(this)" aria-selected="false" data-src="https://example.com"><i class="material-symbols-outlined">lock</i><span>Privacy</span></button>
        <button onclick="showTab(this)" aria-selected="false" data-src="https://example.com"><i class="material-symbols-outlined">language</i><span>Language</span></button>
        <button onclick="showTab(this)" aria-selected="false" data-src="https://example.com"><i class="material-symbols-outlined">computer</i><span>System</span></button>
        <button onclick="showTab(this)" aria-selected="false" data-src="https://example.com"><i class="material-symbols-outlined">info</i><span>About</span></button>
        <button id="toggleSidebarBtn" onclick="toggleSidebar()" aria-label="Toggle sidebar"><i class="material-symbols-outlined">keyboard_double_arrow_left</i><span>Collapse</span></button>
    </aside>

    <main id="content" role="tabpanel">
        <div id="loader-overlay">
            <span class="loader"></span>
        </div>
        <iframe id="main-iframe" src="https://example.com" title="Main Content"></iframe>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        const toggleBtn = document.getElementById('toggleSidebarBtn');
        const buttons = sidebar.querySelectorAll('button:not(#toggleSidebarBtn)');
        const mainIframe = document.getElementById('main-iframe');
        const loaderOverlay = document.getElementById('loader-overlay');

        function showTab(btn) {
            // Stap 1: Toon de laadanimatie direct en verberg de iframe.
            loaderOverlay.classList.remove('hidden');
            mainIframe.style.opacity = '0';

            // Verwijder de 'active' class van alle knoppen en voeg deze toe aan de geklikte knop.
            buttons.forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });
            btn.classList.add('active');
            btn.setAttribute('aria-selected', 'true');

            // Stap 2: Na een korte vertraging, wijzig de URL van de iframe.
            // Dit geeft de CSS-overgang tijd om te starten, wat 'schokken' voorkomt.
            setTimeout(() => {
                mainIframe.src = btn.dataset.src;
            }, 100);
        }

        // Stap 3: De iframe is geladen, toon de inhoud en verberg de laadanimatie.
        mainIframe.onload = () => {
            // Wacht een moment om de CSS-transitie van de iframe (opacity) te laten werken.
            setTimeout(() => {
                mainIframe.style.opacity = '1';
                // Verberg de laadanimatie na de iframe zichtbaar is.
                loaderOverlay.classList.add('hidden');
            }, 300);
        };

        function toggleSidebar() {
            if (window.innerWidth > 768) {
                sidebar.classList.toggle('collapsed');
                content.classList.toggle('collapsed-sidebar');
                updateToggleButton();
            }
        }

        function updateToggleButton() {
            if (window.innerWidth > 768) {
                const isCollapsed = sidebar.classList.contains('collapsed');
                const icon = toggleBtn.querySelector('i');
                const text = toggleBtn.querySelector('span');
                icon.textContent = isCollapsed ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left';
                text.textContent = isCollapsed ? 'Expand' : 'Collapse';
            }
        }

        function handleResize() {
            if (window.innerWidth <= 768) {
                sidebar.classList.add('collapsed');
                content.classList.remove('collapsed-sidebar');
            } else {
                sidebar.classList.remove('collapsed');
                content.classList.remove('collapsed-sidebar');
            }
            updateToggleButton();
        }

        window.addEventListener('DOMContentLoaded', () => {
            handleResize();
            mainIframe.onload();
        });
        window.addEventListener('resize', handleResize);
    </script>
</body>
</html>
