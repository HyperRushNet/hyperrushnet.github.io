<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome! - HyperRush</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{margin:0;padding:20px;background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow-x:hidden}#particles-js{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}.container{max-width:400px;width:100%;padding:30px;background:rgba(30,30,30,.2);border-radius:12px;box-shadow:0 0 25px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);position:relative;z-index:1;transition:transform .3s ease}.blur-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:inherit;backdrop-filter:blur(12px) brightness(.7);z-index:-1;border-radius:12px;overflow:hidden}.logo{width:100%;max-width:400px;margin-bottom:20px;filter:drop-shadow(0 0 8px rgba(0,255,224,.4)) contrast(1.1)}form{display:flex;flex-direction:column;gap:20px;width:100%}.field{position:relative;width:100%}.field input{width:100%;padding:12px 0 8px;font-size:16px;color:#fff;background:0 0;border:none;border-bottom:2px solid #444;transition:border-color .3s}.field input:focus{outline:0;border-color:#00ffe0}.field label{position:absolute;top:12px;left:0;color:#888;font-size:16px;pointer-events:none;transition:all .3s ease}.field input:focus+label,.field input:not(:placeholder-shown)+label{top:-10px;font-size:12px;color:#00ffe0}.dropdown{position:relative;width:100%}.dropdown-button{background:rgba(255,255,255,.1);color:#fff;padding:12px 16px;border:2px solid #444;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;font-size:16px;transition:border-color .3s,background .3s}.dropdown-button:hover{border-color:#00ffe0;background:rgba(255,255,255,.15)}.dropdown-menu{position:absolute;top:100%;left:0;right:0;background:rgba(30,30,30,.9);border:1px solid rgba(0,255,224,.2);border-radius:6px;box-shadow:0 4px 10px rgba(0,255,224,.2);display:none;z-index:10;margin-top:4px;max-height:200px;overflow-y:auto}.dropdown-menu.show{display:block}.dropdown-item{padding:10px 16px;cursor:pointer;color:#fff;text-align:left;transition:background .2s}.dropdown-item:hover{background:rgba(0,255,224,.2)}.dropdown-item.selected{background:rgba(0,255,224,.3);color:#00ffe0}.send-button{width:100%;padding:12px;background:#009fbf;border:none;border-radius:8px;font-size:16px;font-weight:700;color:#000;cursor:pointer;transition:background .3s,box-shadow .3s;box-shadow:0 4px 15px rgba(0,255,224,.4)}.send-button:hover{background:#00d6c0;box-shadow:0 6px 20px rgba(0,255,224,.6)}@media (max-width:600px){.container{padding:20px}.field input,.dropdown-button,.send-button{font-size:14px;padding:10px 14px}.field label{font-size:14px}.field input:focus+label,.field input:not(:placeholder-shown)+label{font-size:10px}.dropdown-item{font-size:14px;padding:8px 14px}}</style>
</head>
<body>
  <div id="particles-js"></div>
  <div class="container">
    <div class="blur-overlay"></div>
    <img src="https://hyperrushnet.github.io/assets/logo.png" alt="Logo" class="logo">
    <form id="selection-form" autocomplete="off">
      <div class="field">
        <input type="text" id="name" placeholder=" " autocomplete="off">
        <label for="name">Name</label>
      </div>
      <div class="field">
        <input type="text" id="message" placeholder=" " autocomplete="off">
        <label for="message">Message</label>
      </div>
      <div class="dropdown" id="device-dropdown">
        <button type="button" class="dropdown-button" onclick="toggleDropdown('device-dropdown')">
          <span>Select Device</span>
          <span class="material-icons">arrow_drop_down</span>
        </button>
        <div class="dropdown-menu">
          <div class="dropdown-item" onclick="selectItem('device-dropdown', 'Computer')">Computer</div>
          <div class="dropdown-item" onclick="selectItem('device-dropdown', 'Phone')">Phone</div>
          <div class="dropdown-item" onclick="selectItem('device-dropdown', 'Tablet')">Tablet</div>
        </div>
      </div>
      <div class="dropdown" id="color-dropdown">
        <button type="button" class="dropdown-button" onclick="toggleDropdown('color-dropdown')">
          <span>Select Color</span>
          <span class="material-icons">arrow_drop_down</span>
        </button>
        <div class="dropdown-menu">
          <div class="dropdown-item" onclick="selectItem('color-dropdown', 'Red')">Red</div>
          <div class="dropdown-item" onclick="selectItem('color-dropdown', 'Blue')">Blue</div>
          <div class="dropdown-item" onclick="selectItem('color-dropdown', 'Green')">Green</div>
        </div>
      </div>
      <div class="dropdown" id="country-dropdown">
        <button type="button" class="dropdown-button" onclick="toggleDropdown('country-dropdown')">
          <span>Select Country</span>
          <span class="material-icons">arrow_drop_down</span>
        </button>
        <div class="dropdown-menu">
          <div class="dropdown-item" onclick="selectItem('country-dropdown', 'USA')">USA</div>
          <div class="dropdown-item" onclick="selectItem('country-dropdown', 'Germany')">Germany</div>
          <div class="dropdown-item" onclick="selectItem('country-dropdown', 'India')">India</div>
        </div>
      </div>
      <button type="submit" class="send-button">Send</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>particlesJS("particles-js",{particles:{number:{value:120,density:{enable:!0,value_area:800}},color:{value:"#00ffe0"},shape:{type:"circle"},opacity:{value:.7,random:!0},size:{value:2,random:!0},line_linked:{enable:!0,distance:150,color:"#00ffe0",opacity:.4,width:1},move:{enable:!0,speed:2,direction:"none",random:!0,straight:!1,out_mode:"out"}},interactivity:{detect_on:"canvas",events:{onhover:{enable:!0,mode:"grab"},onclick:{enable:!0,mode:"push"},resize:!0},modes:{grab:{distance:150,line_linked:{opacity:.8}},push:{particles_nb:4}}},retina_detect:!0});function toggleDropdown(a){const b=document.getElementById(a),c=b.querySelector(".dropdown-menu"),d=c.classList.contains("show");document.querySelectorAll(".dropdown-menu").forEach(a=>a.classList.remove("show"));d||c.classList.add("show")}function selectItem(a,b){const c=document.getElementById(a),d=c.querySelector(".dropdown-button span:first-child"),e=c.querySelectorAll(".dropdown-item");d.textContent=b,e.forEach(a=>a.classList.toggle("selected",a.textContent===b)),c.querySelector(".dropdown-menu").classList.remove("show")}document.addEventListener("click",a=>{a.target.closest(".dropdown")||document.querySelectorAll(".dropdown-menu").forEach(a=>a.classList.remove("show"))});</script>
</body>
</html>
