<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Perfect Verspreide Random Circles met Fade</title>
<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #121212;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .circle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    user-select: none;
    mix-blend-mode: screen;
    opacity: 0;
    will-change: transform, opacity;
    transition: opacity 1s ease-in-out;
  }
  .circle.visible {
    opacity: 1;
  }
  #circle1 {
    width: 400px;
    height: 400px;
    top: 20px;
    left: 20px;
    background: radial-gradient(circle at center, #a0e9ff55, transparent 70%);
    opacity: 1;
    pointer-events: none;
  }
  #circle2 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle at center, #ffd6a555, transparent 70%);
  }
  #circle3 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle at center, #a5ffc955, transparent 70%);
  }
  #circle4 {
    width: 350px;
    height: 350px;
    background: radial-gradient(circle at center, #ffa5d655, transparent 70%);
  }
  #circle5 {
    width: 250px;
    height: 250px;
    background: radial-gradient(circle at center, #d6a5ff55, transparent 70%);
  }

  form {
    position: relative;
    z-index: 10;
    background: rgba(30, 30, 30, 0.9);
    backdrop-filter: blur(10px);
    padding: 32px 36px;
    border-radius: 14px;
    width: 340px;
    max-width: 100%;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    color: white;
  }
  .field {
    position: relative;
    margin-bottom: 26px;
  }
  input {
    width: 100%;
    padding: 12px 0 8px;
    font-size: 16px;
    color: white;
    background: transparent;
    border: none;
    border-bottom: 2px solid #444;
    transition: border-color 0.3s;
  }
  input:focus {
    outline: none;
    border-color: #00ffe0;
  }
  label {
    position: absolute;
    top: 12px;
    left: 0;
    color: #888;
    font-size: 14px;
    pointer-events: none;
    transition: 0.3s ease;
  }
  input:focus + label,
  input:not(:placeholder-shown) + label {
    top: -10px;
    font-size: 12px;
    color: #00ffe0;
  }

  /* Dropdown styles */
  .dropdown {
    position: relative;
    user-select: none;
  }
  .dropdown-toggle {
    background: transparent;
    border: none;
    border-bottom: 2px solid #444;
    width: 100%;
    text-align: left;
    padding: 12px 0 8px;
    font-size: 16px;
    color: white;
    cursor: pointer;
    position: relative;
    transition: border-color 0.3s;
  }
  .dropdown-toggle:focus {
    outline: none;
    border-color: #00ffe0;
  }
  .dropdown-toggle::after {
    content: "▾";
    position: absolute;
    right: 0;
    top: 12px;
    color: #888;
    font-size: 14px;
    transition: transform 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  .dropdown-toggle.active::after {
    transform: rotate(180deg);
    color: #00ffe0;
  }
  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #2a2a2a;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    z-index: 10;
    max-height: 0;
    transition: max-height 0.4s cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  .dropdown.open .dropdown-menu {
    max-height: 500px;
  }
  .dropdown-option {
    padding: 10px 12px;
    cursor: pointer;
    transition: background 0.25s cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  .dropdown-option:hover,
  .dropdown-option:focus {
    background: #00ffe030;
    outline: none;
  }

  .dropdown-label {
    position: absolute;
    top: 12px;
    left: 0;
    font-size: 14px;
    color: #888;
    transition: 0.3s ease;
    pointer-events: none;
  }
  .dropdown.filled .dropdown-label {
    top: -10px;
    font-size: 12px;
    color: #00ffe0;
  }

  button {
    width: 100%;
    padding: 12px;
    background: #00ffe0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    color: #000;
    cursor: pointer;
    transition: background 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
    margin-top: 8px;
  }
  button:hover {
    background: #00d6c0;
  }
</style>
</head>
<body>
  <!-- Circles in background -->
  <div class="circle visible" id="circle1"></div>
  <div class="circle" id="circle2"></div>
  <div class="circle" id="circle3"></div>
  <div class="circle" id="circle4"></div>
  <div class="circle" id="circle5"></div>

  <form autocomplete="off" novalidate>
    <div class="field">
      <input type="text" id="name" placeholder=" " autocomplete="off" required />
      <label for="name">Naam</label>
    </div>
    <div class="field">
      <input type="email" id="email" placeholder=" " autocomplete="off" required />
      <label for="email">E-mail</label>
    </div>
    <div class="field">
      <input type="text" id="subject" placeholder=" " autocomplete="off" required />
      <label for="subject">Onderwerp</label>
    </div>

    <div class="field dropdown" id="customDropdown">
      <div class="dropdown-toggle" id="dropdownToggle" tabindex="0">Selecteer een categorie</div>
      <label class="dropdown-label">Categorie</label>
      <div class="dropdown-menu" role="listbox" aria-labelledby="dropdownToggle" tabindex="-1">
        <div class="dropdown-option" role="option" tabindex="0">Feedback</div>
        <div class="dropdown-option" role="option" tabindex="0">Support</div>
        <div class="dropdown-option" role="option" tabindex="0">Overig</div>
      </div>
    </div>

    <div class="field">
      <input type="text" id="code" placeholder=" " autocomplete="off" required />
      <label for="code">Referentiecode</label>
    </div>

    <button type="submit">Verzend</button>
  </form>

<script>
  const dropdown = document.getElementById('customDropdown');
  const toggle = dropdown.querySelector('.dropdown-toggle');
  const menu = dropdown.querySelector('.dropdown-menu');
  const options = dropdown.querySelectorAll('.dropdown-option');

  toggle.addEventListener('click', () => {
    const isOpen = dropdown.classList.toggle('open');
    toggle.classList.toggle('active', isOpen);
    if (isOpen) {
      menu.focus();
    }
  });
  toggle.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      dropdown.classList.add('open');
      toggle.classList.add('active');
      menu.focus();
    }
    if (e.key === 'Escape') {
      dropdown.classList.remove('open');
      toggle.classList.remove('active');
    }
  });
  menu.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      dropdown.classList.remove('open');
      toggle.classList.remove('active');
      toggle.focus();
    }
  });
  options.forEach(option => {
    option.addEventListener('click', () => selectOption(option));
    option.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectOption(option);
      }
    });
  });

  function selectOption(option) {
    toggle.textContent = option.textContent;
    dropdown.classList.remove('open');
    toggle.classList.remove('active');
    toggle.focus();
    dropdown.classList.add('filled');
  }

  // Circles random position without overlap + fade out / fade in switching

  const circles = [
    {el: document.getElementById('circle2'), w: 300, h: 300},
    {el: document.getElementById('circle3'), w: 500, h: 500},
    {el: document.getElementById('circle4'), w: 350, h: 350},
    {el: document.getElementById('circle5'), w: 250, h: 250}
  ];

  // Position circle1 fixed in corner, already set in CSS

  const padding = 20; // min distance from edges
  const maxAttempts = 200;

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function intersects(r1, r2) {
    return !(r2.left > r1.right ||
             r2.right < r1.left ||
             r2.top > r1.bottom ||
             r2.bottom < r1.top);
  }

  function generatePositions() {
    const positions = [];
    for (let i = 0; i < circles.length; i++) {
      let attempt = 0;
      let pos;
      do {
        const left = randomInt(padding, window.innerWidth - circles[i].w - padding);
        const top = randomInt(padding, window.innerHeight - circles[i].h - padding);
        pos = {left, top, right: left + circles[i].w, bottom: top + circles[i].h};
        attempt++;
      } while (positions.some(r => intersects(r, pos)) && attempt < maxAttempts);
      positions.push(pos);
    }
    return positions;
  }

  function moveCircles(positions) {
    positions.forEach((pos, i) => {
      const c = circles[i].el;
      c.style.left = pos.left + 'px';
      c.style.top = pos.top + 'px';
    });
  }

  // Initial position and show
  let currentPositions = generatePositions();
  moveCircles(currentPositions);
  circles.forEach(c => c.el.classList.add('visible'));

  // Switch positions every 5 sec with fade out -> move -> fade in
  setInterval(() => {
    // Fade out all circles except circle1
    circles.forEach(c => c.el.classList.remove('visible'));

    setTimeout(() => {
      currentPositions = generatePositions();
      moveCircles(currentPositions);
      circles.forEach(c => c.el.classList.add('visible'));
    }, 1000); // match CSS transition duration
  }, 5000);

</script>
</body>
</html>
