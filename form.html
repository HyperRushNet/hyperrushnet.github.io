<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Form Only</title>
<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    margin: 0;
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  form {
    background: rgba(30, 30, 30, 0.9);
    backdrop-filter: blur(10px);
    padding: 32px 36px;
    border-radius: 14px;
    width: 340px;
    max-width: 100%;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    color: white;
    position: relative;
    z-index: 10;
  }
  .field {
    position: relative;
    margin-bottom: 26px;
  }
  input {
    width: 100%;
    padding: 12px 0 8px;
    font-size: 16px;
    color: white;
    background: transparent;
    border: none;
    border-bottom: 2px solid #444;
    transition: border-color 0.3s;
  }
  input:focus {
    outline: none;
    border-color: #00ffe0;
  }
  label {
    position: absolute;
    top: 12px;
    left: 0;
    color: #888;
    font-size: 14px;
    pointer-events: none;
    transition: 0.3s ease;
  }
  input:focus + label,
  input:not(:placeholder-shown) + label {
    top: -10px;
    font-size: 12px;
    color: #00ffe0;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #00ffe0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    color: #000;
    cursor: pointer;
    transition: background 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
    margin-top: 8px;
  }
  button:hover {
    background: #00d6c0;
  }
</style>
</head>
<body>
  <form autocomplete="off" novalidate>
    <div class="field">
      <input type="text" id="name" placeholder=" " autocomplete="off" required />
      <label for="name">Naam</label>
    </div>
    <div class="field">
      <input type="email" id="email" placeholder=" " autocomplete="off" required />
      <label for="email">E-mail</label>
    </div>
    <div class="field">
      <input type="text" id="subject" placeholder=" " autocomplete="off" required />
      <label for="subject">Onderwerp</label>
    </div>
    <div class="field">
      <input type="text" id="code" placeholder=" " autocomplete="off" required />
      <label for="code">Referentiecode</label>
    </div>
    <button type="submit">Verzend</button>
  </form>
</body>
</html>
