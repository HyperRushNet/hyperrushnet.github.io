<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minimal Form</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
body {
  font-family: 'Inter', sans-serif;
  background-image: url('https://cdn.pixabay.com/photo/2017/04/05/04/44/background-2203989_1280.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

    .formbold-main-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      min-height: 100vh;
    }
    .formbold-form-wrapper {
      background: white;
      padding: 50px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 0 12px rgba(0,0,0,0.06);
    }
    .formbold-form-label {
      color: #07074d;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
    }
    .formbold-form-input,
    .formbold-form-select {
      width: 100%;
      padding: 16px 22px;
      border: 1px solid #dde3ec;
      border-radius: 0;
      background: #fff;
      font-size: 16px;
      color: #07074d;
      outline: none;
    }
    .formbold-form-input:focus,
    .formbold-form-select:focus {
      border-color: #6a64f1;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }
    .formbold-input-group {
      margin-bottom: 24px;
    }
    .formbold-btn {
      width: 100%;
      padding: 18px;
      background-color: #6a64f1;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .formbold-btn:hover {
      background-color: #5853d7;
    }
  </style>
</head>
<body>
  <div class="formbold-main-wrapper">
    <div class="formbold-form-wrapper">
      <form id="deviceForm">
        <div class="formbold-input-group">
          <label for="name" class="formbold-form-label">Naam</label>
          <input type="text" id="name" name="name" class="formbold-form-input" required>
        </div>

        <div class="formbold-input-group">
          <label for="device" class="formbold-form-label">Device type</label>
          <select id="device" name="device" class="formbold-form-select" required>
            <option value="">Kies een type</option>
            <option value="Phone">Phone</option>
            <option value="Tablet">Tablet</option>
            <option value="Laptop">Laptop</option>
            <option value="Desktop">Desktop</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="formbold-input-group">
          <label for="theme" class="formbold-form-label">Thema</label>
          <input type="text" id="theme" name="theme" placeholder="Thema naam" class="formbold-form-input" required>
        </div>

        <input type="hidden" id="key" name="key">

        <button type="submit" class="formbold-btn">Opslaan</button>
      </form>
    </div>
  </div>

  <script>
    // Genereer random key
    function generateKey() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let key = '';
      for (let i = 0; i < 12; i++) {
        key += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return key;
    }

    // Key automatisch invullen
    document.getElementById('key').value = generateKey();

    // Submit-handler
    document.getElementById('deviceForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const data = {
        name: this.name.value,
        device: this.device.value,
        theme: this.theme.value,
        key: this.key.value
      };
      console.log('Verzonden:', data);
      alert('Informatie opgeslagen!');
      // Hier kan fetch() komen naar backend
    });
  </script>
</body>
</html>
