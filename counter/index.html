<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Counter Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }

    h1 { margin-bottom: 1rem; }
    button {
      padding: 0.8rem 1.5rem;
      margin: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #4CAF50;
      color: white;
    }
    button.reset { background: #f44336; }

    #weekCounters {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .day {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      width: 80px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .day-name { font-weight: bold; margin-bottom: 0.5rem; }
    .day-value { font-size: 1.5rem; color: #333; }
  </style>
</head>
<body>
  <h1>Visitor Counter Dashboard</h1>
  <div>
    <button id="viewBtn">View Week</button>
    <button id="addBtn">Add Visit</button>
    <button class="reset" id="resetBtn">Reset Week</button>
  </div>

  <div id="weekCounters"></div>

  <script>
    const API_BASE = 'https://rcount.onrender.com';
    const weekCountersDiv = document.getElementById('weekCounters');
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    async function fetchWeek() {
      try {
        const res = await fetch(`${API_BASE}/`);
        if (!res.ok) throw new Error('Failed to fetch week data');
        const data = await res.json();
        renderWeek(data);
      } catch (err) {
        weekCountersDiv.innerHTML = `<p style="color:red">${err.message}</p>`;
      }
    }

    async function addVisit() {
      try {
        const res = await fetch(`${API_BASE}/add`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        if (!res.ok) throw new Error('Failed to add visit');
        const data = await res.json();
        renderWeek(data);
      } catch (err) {
        weekCountersDiv.innerHTML = `<p style="color:red">${err.message}</p>`;
      }
    }

    async function resetWeek() {
      try {
        const res = await fetch(`${API_BASE}/reset`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        if (!res.ok) throw new Error('Failed to reset week');
        const data = await res.json();
        renderWeek(data);
      } catch (err) {
        weekCountersDiv.innerHTML = `<p style="color:red">${err.message}</p>`;
      }
    }

    function renderWeek(array) {
      weekCountersDiv.innerHTML = '';
      array.forEach((value, idx) => {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'day';
        dayDiv.innerHTML = `<div class="day-name">${days[idx]}</div><div class="day-value">${value}</div>`;
        weekCountersDiv.appendChild(dayDiv);
      });
    }

    document.getElementById('viewBtn').addEventListener('click', fetchWeek);
    document.getElementById('addBtn').addEventListener('click', addVisit);
    document.getElementById('resetBtn').addEventListener('click', resetWeek);

    // Load initial data
    fetchWeek();
  </script>
</body>
</html>
