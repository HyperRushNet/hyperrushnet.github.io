<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Platform en Apparaat Detectie</title>
</head>
<body>
  <h1>Platform en Apparaat Detectie</h1>
  <p id="info">Bezig met detecteren...</p>

  <script>
    function detectInfo() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      let platform = "Onbekend platform";
      let deviceType = "Onbekend apparaat";

      // Platform detectie
      if (/windows phone/i.test(ua)) {
        platform = "Windows Phone";
      } else if (/android/i.test(ua)) {
        platform = "Android";
      } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        platform = "iOS";
      } else if (/Win/.test(navigator.platform)) {
        platform = "Windows";
      } else if (/Mac/.test(navigator.platform)) {
        platform = "macOS";
      } else if (/Linux/.test(navigator.platform)) {
        platform = "Linux";
      }

      // Apparaat type detectie
      if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
        deviceType = "Tablet";
      } else if (/(kindle)|(ipod)|(blackberry)/i.test(ua) || (/(android|webos|iphone)/i.test(ua) && /mobi/i.test(ua))) {
        deviceType = "Mobiel";
      } else if (/Win|Mac|Linux/.test(navigator.platform)) {
        deviceType = "Desktop";
      }
      
      // Specifieke apparaten
      if (/ipad/i.test(ua)) {
          deviceType = "iPad";
      } else if (/iphone/i.test(ua)) {
          deviceType = "iPhone";
      }

      return `Je platform is ${platform} en je apparaat is een ${deviceType}.`;
    }

    document.getElementById('info').textContent = detectInfo();
  </script>
</body>
</html>
