<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/><title>HyperRush Games</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/><style>*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:'Poppins',sans-serif;background:radial-gradient(circle at center,#1e1b1b 0%,#0a0a0a 100%);color:#fff;overflow:hidden}body{display:flex;flex-direction:column;justify-content:space-between;padding:1.5rem;max-width:375px;margin:0 auto;position:relative}.particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}.particle{position:absolute;background:rgba(255,255,255,.3);border-radius:50%;animation:float 8s infinite ease-in-out}@keyframes float{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-40px) scale(1.2);opacity:.8}100%{transform:translateY(0) scale(1);opacity:.4}}.center-content{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:1;position:relative;padding:0 1rem}.logo{width:120px;margin-bottom:1rem;filter:drop-shadow(0 0 4px rgba(255,255,255,0.4))}.title-container{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;width:100%;max-width:300px}.title-container .line{flex-grow:1;height:2px;background:#fff;opacity:.3;border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.3)}h1{font-size:2rem;font-weight:700;margin:0;text-shadow:0 0 10px rgba(255,255,255,.8);color:#fff;white-space:nowrap}.description{font-size:1rem;color:rgba(255,255,255,.85);max-width:300px;margin-bottom:.4rem;text-shadow:0 0 5px rgba(255,255,255,.4)}.subtext{font-size:.9rem;color:rgba(255,255,255,.6);margin-bottom:2rem;font-style:italic;margin-top:1rem}.bottom-button{margin-top:auto;z-index:1;width:100%}.continue-button{display:block;width:100%;padding:1rem 0;background:transparent;border:2px solid #fff;color:#fff;border-radius:.6rem;font-weight:600;font-size:1.2rem;text-align:center;text-decoration:none;transition:all .3s ease;box-shadow:0 0 12px rgba(255,255,255,.4);position:relative;overflow:hidden}.continue-button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(120deg,rgba(255,255,255,.2),rgba(255,255,255,.6),rgba(255,255,255,.2));transform:skewX(-20deg);transition:all .5s ease;pointer-events:none}.continue-button:hover::before{left:100%}.continue-button:hover{background:rgba(255,255,255,.1);border-color:#eee;color:#eee;box-shadow:0 0 18px rgba(255,255,255,.7)}</style></head><body><div class="particles"></div><div class="center-content"><img src="https://hyperrushnet.github.io/assets/images/logo/white.png" alt="HyperRush Logo" class="logo"/><div class="title-container"><div class="line"></div><h1>HyperRush</h1><div class="line"></div></div><p class="description">There are hundreds of games, right at your fingertips, waiting for you!</p><p class="subtext">Tap continue to dive in!</p></div><div class="bottom-button"><a href="#" class="continue-button">Continue</a></div><script>const particlesContainer=document.querySelector('.particles');for(let i=0;i<20;i++){const p=document.createElement('div');const size=Math.random()*4+2;p.classList.add('particle');p.style.width=`${size}px`;p.style.height=`${size}px`;p.style.left=`${Math.random()*100}%`;p.style.top=`${Math.random()*100}%`;p.style.animationDelay=`${Math.random()*5}s`;particlesContainer.appendChild(p)}</script></body></html>
