<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HyperRush Games</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    height: 100%;
    font-family: 'Poppins', sans-serif;
    background-image: linear-gradient(to top, #03011f, #181269);
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    max-width: 450px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  .center-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 1rem;
    gap: 1rem;
    position: relative;
    z-index: 1;
  }
  .logo {
    width: 120px;
    filter: none; /* geen effect */
    /* geen animatie */
  }
  .title-container {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    max-width: 300px;
  }
  .title-container .line {
    flex-grow: 1;
    height: 2px;
    background: #fff;
    opacity: 0.25;
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(255,255,255,0.15);
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
    margin: 0;
  }
  #desc {
    font-size: 1rem;
    color: rgba(255,255,255,0.9);
    max-width: 300px;
    line-height: 1.3;
    text-shadow: 0 0 4px rgba(0,0,0,0.3);
  }
  .subtext {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.6);
    font-style: italic;
    text-shadow: 0 0 3px rgba(0,0,0,0.2);
  }
  .bottom-button {
    width: 100%;
    margin-top: 2rem;
    z-index: 1;
  }
  .continue-button {
    display: block;
    width: 100%;
    padding: 1rem 0;
    background: transparent;
    border: 2px solid #fff;
    color: #fff;
    border-radius: 0.6rem;
    font-weight: 600;
    font-size: 1.2rem;
    text-align: center;
    text-decoration: none;
    transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 0 12px rgba(255,255,255,0.3);
    position: relative;
    overflow: hidden;
  }
  .continue-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, rgba(255,255,255,0.15), rgba(255,255,255,0.4), rgba(255,255,255,0.15));
    transform: skewX(-20deg);
    transition: all 0.5s ease;
    pointer-events: none;
  }
  .continue-button:hover::before {
    left: 100%;
  }
  .continue-button:hover {
    background: rgba(255,255,255,0.12);
    border-color: #eee;
    color: #eee;
    box-shadow: 0 0 18px rgba(255,255,255,0.6);
  }
</style>
</head>
<body>
  <div class="center-content">
    <img src="https://hyperrushnet.github.io/assets/images/logo/white.png" alt="HyperRush Logo" class="logo" />
    <div class="title-container">
      <div class="line"></div>
      <h1>HYPERRUSH</h1>
      <div class="line"></div>
    </div>
    <p id="desc">There are hundreds of games, right at your fingertips, waiting for you!</p>
    <p class="subtext">Tap continue to dive in!</p>
  </div>
  <div class="bottom-button">
    <a href="#" class="continue-button">Continue</a>
  </div>
<script>
  const desc = document.getElementById('desc');
  const maxLines = 2;
  const lineHeight = parseFloat(getComputedStyle(desc).lineHeight);
  const maxHeight = maxLines * lineHeight;

  function fitText() {
    desc.style.fontSize = '1rem'; // reset
    let fontSize = parseFloat(getComputedStyle(desc).fontSize);
    while (desc.scrollHeight > maxHeight && fontSize > 10) {
      fontSize -= 0.5;
      desc.style.fontSize = fontSize + 'px';
    }
  }

  window.addEventListener('load', fitText);
  window.addEventListener('resize', fitText);
</script>
</body>
</html>
