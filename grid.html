<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               minimum-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
<title>Game Grid Background</title>
<style>
  html, body {
    margin: 0;
    overflow: hidden;
    background: black;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.1);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="overlay"></div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cw = 0, ch = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cw = cssW;
  ch = cssH;
}
resize();
window.addEventListener('resize', resize, { passive: true });

const img = new Image();
img.src = 'https://hyperrushnet.github.io/assets/images/background/game-grid.webp';

let scrollX = 0;
const speed = 1.5;
const tileSizePx = 300;
const zoomFactor = 10.0;

img.onload = () => requestAnimationFrame(draw);

function draw() {
  ctx.clearRect(0, 0, cw, ch);

  const imgRatio = img.width / img.height;
  const drawW = Math.round(tileSizePx * zoomFactor);
  const drawH = Math.round(drawW / imgRatio);

  scrollX = (scrollX + speed) % drawW;

  ctx.save();
  ctx.translate(cw / 2, ch / 2);
  ctx.rotate(Math.PI / 4);
  ctx.translate(-cw / 2, -ch / 2);

  const cols = Math.ceil(cw / drawW) + 3;
  const rows = Math.ceil(ch / drawH) + 3;

  for (let j = -1; j < rows; j++) {
    for (let i = -1; i < cols; i++) {
      const x = -scrollX + i * drawW;
      const y = j * drawH;
      ctx.drawImage(img, x, y, drawW, drawH);
    }
  }

  ctx.restore();
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
