<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fullscreen 45° Game Grid - Infinite Seamless Scroll</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: #111; display: flex; justify-content: center; align-items: center;
  }
  #container {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  #grid {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    display: flex; flex-direction: column;
    gap: 4px; user-select: none; opacity: 0;
    transition: opacity 0.4s ease-in-out;
  }
  .row {
    width: max-content;
    height: 180px;
    background-repeat: repeat-x;
    background-position: 0 0;
    background-size: auto 100%;
    animation: scroll-left var(--duration) linear infinite;
  }
  .row.offset { margin-left: calc((240px + 4px) / 2); }

  @keyframes scroll-left {
    0% { background-position: 0 0; }
    100% { background-position: var(--scroll-distance) 0; }
  }
</style>
</head>
<body>
  <div id="container">
    <div id="grid"></div>
  </div>

<script>
(async () => {
  const grid = document.getElementById('grid');
  const jsonUrl = 'https://hyperrushnet.github.io/assets/json/games.json';

  const cardW = 240;
  const cardH = 180;
  const gap = 4;
  const scrollSpeed = 60; // px/sec

  // Load JSON
  let games = [];
  try {
    const resp = await fetch(jsonUrl);
    if (!resp.ok) throw new Error("Failed to load JSON");
    games = (await resp.json()).filter(g => g.img && g.img.length > 5);
  } catch (e) {
    alert("Error loading JSON: " + e.message);
    return;
  }

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const effectiveW = Math.ceil(vw * Math.SQRT2);
  const effectiveH = Math.ceil(vh * Math.SQRT2);
  const totalCardW = cardW + gap;
  const totalCardH = cardH + gap;
  const cols = Math.ceil(effectiveW / totalCardW) + 1;
  const rows = Math.ceil(effectiveH / totalCardH) + 1;

  // Preload all images
  function preloadImage(src) {
    return new Promise(res => {
      const img = new Image();
      img.src = src;
      img.onload = img.onerror = () => res(img);
    });
  }

  // Create one sprite (canvas) for a single row
  async function createRowTexture(startIndex) {
    const canvas = document.createElement('canvas');
    canvas.width = cols * totalCardW;
    canvas.height = cardH;

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let c = 0; c < cols; c++) {
      const game = games[(startIndex + c) % games.length];
      const img = await preloadImage('https://hyperrushnet.github.io' + game.img);
      ctx.drawImage(img, c * totalCardW, 0, cardW, cardH);
    }
    return canvas.toDataURL();
  }

  // Build all rows
  for (let r = 0; r < rows; r++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';
    if (r % 2) rowDiv.classList.add('offset');

    const rowTexture = await createRowTexture(r * cols);
    rowDiv.style.backgroundImage = `url(${rowTexture})`;

    // Set animation properties
    const scrollDistance = -cols * totalCardW + "px";
    const duration = (cols * totalCardW) / scrollSpeed;
    rowDiv.style.setProperty('--scroll-distance', scrollDistance);
    rowDiv.style.setProperty('--duration', duration + 's');

    grid.appendChild(rowDiv);
  }

  grid.style.opacity = '1';
  window.addEventListener('resize', () => location.reload());
})();
</script>
</body>
</html>
