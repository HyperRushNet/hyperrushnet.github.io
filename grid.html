<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrollende Gamecards</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            transform: rotate(45deg) scale(1.5); /* Draait 45 graden en zoomt in met factor 1.5 */
            transform-origin: center center; /* Rotatie en zoom vanuit het midden */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            height: 100vh; /* Volledige hoogte van het scherm */
            overflow: hidden;
            position: relative;
        }
        .scrolling-image {
            width: 4000px; /* Twee keer de breedte van de afbeelding voor naadloze herhaling */
            height: 1500px;
            background-image: url('https://hyperrushnet.github.io/assets/images/background/game-grid.webp');
            background-repeat: repeat-x; /* Herhaalt de afbeelding horizontaal */
            animation: scroll 10s linear infinite; /* 10 seconden per cyclus */
        }
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-2000px); /* Verschuift exact één afbeelding-breedte */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scrolling-image"></div>
    </div>
</body>
</html>
